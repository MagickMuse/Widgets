<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fce8e6; --bg2:#f5d0cc;
    --text:#3d1515; --muted:#8b4545;
    --accent:#c0392b; --crimson:#a82222;
  }
  *{box-sizing:border-box;}
  html,body{background:transparent;}
  body{margin:0;font-family:'EB Garamond',serif;color:var(--text);padding:16px;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;background:var(--bg);border:1px solid rgba(160,37,36,.3);border-radius:14px;padding:20px;}
  h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.3rem;text-align:center;letter-spacing:.06em;color:var(--text);margin:0 0 4px;text-transform:uppercase;}
  .sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:18px;font-style:italic;}
  .card{background:var(--bg2);border:1px solid rgba(160,37,36,.25);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(160,37,36,.08);}
  .section-label{color:var(--accent);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}

  /* Moon Phase */
  .moon-main{text-align:center;}
  .moon-emoji{font-size:3.5rem;display:block;margin-bottom:6px;line-height:1;}
  .moon-name{font-family:'Cinzel Decorative',serif;font-size:1.2rem;color:var(--text);letter-spacing:.04em;margin-bottom:4px;}
  .moon-illum{color:var(--muted);font-size:.82rem;margin-bottom:10px;}
  .moon-next{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);border-top:1px solid rgba(160,37,36,.2);padding-top:10px;margin-top:10px;}
  .moon-desc{font-size:.88rem;line-height:1.55;color:var(--text);font-style:italic;margin-top:10px;text-align:left;border-top:1px solid rgba(160,37,36,.2);padding-top:10px;}
  .moon-link{display:inline-flex;align-items:center;gap:5px;margin-top:10px;color:var(--accent);font-size:.8rem;text-decoration:none;letter-spacing:.03em;border:1px solid rgba(192,57,43,.3);padding:5px 12px;border-radius:6px;}
  .moon-link:hover{background:rgba(192,57,43,.1);}

  /* Retrograde */
  .retro-list{display:flex;flex-direction:column;gap:8px;}
  .retro-item{display:flex;align-items:center;justify-content:space-between;font-size:.88rem;}
  .retro-planet{display:flex;align-items:center;gap:8px;}
  .retro-symbol{font-size:1.2rem;color:var(--accent);}
  .retro-name{color:var(--text);}
  .retro-name a{color:var(--text);text-decoration:none;border-bottom:1px dotted rgba(160,37,36,.4);}
  .retro-name a:hover{color:var(--accent);}
  .retro-meta{font-size:.75rem;color:var(--muted);text-align:right;}
  .retro-badge{display:inline-block;background:rgba(192,57,43,.15);color:var(--accent);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:10px;margin-left:6px;}
  .retro-upcoming{opacity:.7;}
  .none-msg{font-size:.85rem;color:var(--muted);font-style:italic;}
  .divider{height:1px;background:rgba(160,37,36,.15);margin:10px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sky Watch</h1>
  <div class="sub">Moon phases &amp; planetary retrogrades</div>

  <div class="card moon-main" id="moonCard">
    <div class="section-label">Current Moon Phase</div>
    <span class="moon-emoji" id="moonEmoji"></span>
    <div class="moon-name" id="moonName"></div>
    <div class="moon-illum" id="moonIllum"></div>
    <div class="moon-desc" id="moonDesc"></div>
    <div style="text-align:center"><a class="moon-link" id="moonLink" href="#" target="_blank" rel="noopener noreferrer">Open Grimoire Page</a></div>
    <div class="moon-next">
      <span id="moonPrev"></span>
      <span id="moonNextLabel"></span>
    </div>
  </div>

  <div class="card" id="retroCard">
    <div class="section-label">Planetary Retrogrades</div>
    <div id="activeRetro"></div>
    <div class="divider" id="retroDivider" style="display:none"></div>
    <div id="upcomingRetro"></div>
  </div>
</div>

<script>
// ── Moon Phase Calculation ─────────────────────────────────────────────────
// Reference new moon: Jan 6, 2000 18:14 UTC
const REF_NEW_MOON = new Date('2000-01-06T18:14:00Z');
const SYNODIC = 29.53058867; // days

const PHASES = [
  { name: 'New Moon',        emoji: '🌑', minDay: 0,     maxDay: 1.85,  illumMin: 0,  illumMax: 2,
    desc: 'The dark moon — a time of beginnings, intention-setting, and planting seeds. The veil between worlds is open. Rest, reflect, and call in what you wish to manifest.',
    url: 'https://app.notion.com/p/1f716dcf716480538e06ce524f599d73' },
  { name: 'Waxing Crescent', emoji: '🌒', minDay: 1.85,  maxDay: 7.38,  illumMin: 2,  illumMax: 48,
    desc: 'The moon grows, and so does your intention. A time for taking first steps, gathering resources, and nurturing new projects. Energy is building — move with it.',
    url: 'https://app.notion.com/p/1f716dcf716480d38a90ea99da996b3e' },
  { name: 'First Quarter',   emoji: '🌓', minDay: 7.38,  maxDay: 9.22,  illumMin: 48, illumMax: 52,
    desc: 'A moon of action and decision. Challenges arise and momentum demands choices. Push through resistance — the work you do now carries the arc of the full moon.',
    url: 'https://app.notion.com/p/1f716dcf7164808e88fbee31876299cc' },
  { name: 'Waxing Gibbous',  emoji: '🌔', minDay: 9.22,  maxDay: 14.77, illumMin: 52, illumMax: 98,
    desc: 'Refinement and anticipation. You can see the shape of what you\'re building. Fine-tune your work, adjust your aim, and prepare for the power of the full moon.',
    url: 'https://app.notion.com/p/1f716dcf716480b8afc0c77458907627' },
  { name: 'Full Moon',       emoji: '🌕', minDay: 14.77, maxDay: 16.61, illumMin: 98, illumMax: 100,
    desc: 'The peak of the cycle. Lunar energy reaches maximum power — intuition heightens, emotions run high, and workings are amplified. A night of revelation and release.',
    url: 'https://app.notion.com/p/1f716dcf716480708814cbdc391c2e58' },
  { name: 'Waning Gibbous',  emoji: '🌖', minDay: 16.61, maxDay: 22.15, illumMin: 98, illumMax: 52,
    desc: 'The tide turns inward. A time of gratitude, sharing wisdom, and releasing what was gained. Give thanks, teach what you\'ve learned, and begin to let go.',
    url: 'https://app.notion.com/p/1f716dcf7164808fac24df1aaa95c769' },
  { name: 'Third Quarter',   emoji: '🌗', minDay: 22.15, maxDay: 24.0,  illumMin: 52, illumMax: 48,
    desc: 'A moon of release and forgiveness. Let go of what no longer serves. Break bad habits, dissolve old patterns, and clear the way for the coming new cycle.',
    url: 'https://app.notion.com/p/1f716dcf716480128655fe5905bc4b3a' },
  { name: 'Waning Crescent', emoji: '🌘', minDay: 24.0,  maxDay: 29.53, illumMin: 48, illumMax: 2,
    desc: 'The balsamic moon — a time of rest, surrender, and deep inner work. Withdraw from the outer world. Dream, listen to your intuition, and prepare for rebirth.',
    url: 'https://app.notion.com/p/1f716dcf716480b280b8d1b44504526f' },
];

function getMoonAge(date) {
  const diff = (date - REF_NEW_MOON) / 86400000;
  return ((diff % SYNODIC) + SYNODIC) % SYNODIC;
}

function getIllumination(age) {
  return Math.round((1 - Math.cos(2 * Math.PI * age / SYNODIC)) / 2 * 100);
}

function daysUntilNext(age, targetAge) {
  let d = targetAge - age;
  if (d < 0) d += SYNODIC;
  return d;
}

function fmtDays(d) {
  if (d < 0.5) return 'tonight';
  if (d < 1.5) return 'tomorrow';
  return `in ${Math.round(d)} days`;
}

function renderMoon() {
  const now = new Date();
  const age = getMoonAge(now);
  const phase = PHASES.find(p => age >= p.minDay && age < p.maxDay) || PHASES[0];
  const illum = getIllumination(age);

  // Next phase
  const nextPhaseIdx = (PHASES.indexOf(phase) + 1) % PHASES.length;
  const nextPhase = PHASES[nextPhaseIdx];
  const daysToNext = daysUntilNext(age, nextPhase.minDay);

  // Previous phase start
  const dayInPhase = Math.round(age - phase.minDay);

  document.getElementById('moonEmoji').textContent = phase.emoji;
  document.getElementById('moonName').textContent = phase.name;
  document.getElementById('moonIllum').textContent = `${illum}% illuminated · Day ${Math.floor(age) + 1} of cycle`;
  document.getElementById('moonDesc').textContent = phase.desc;
  document.getElementById('moonLink').href = phase.url;
  document.getElementById('moonLink').textContent = `Open ${phase.name} Page`;
  document.getElementById('moonPrev').textContent = `${dayInPhase === 0 ? 'Just entered' : Math.round(age - phase.minDay) + 'd into'} ${phase.name}`;
  document.getElementById('moonNextLabel').textContent = `${nextPhase.emoji} ${nextPhase.name} ${fmtDays(daysToNext)}`;
}

// ── Retrogrades ────────────────────────────────────────────────────────────
const p = id => `https://app.notion.com/p/${id}`;
const ASTRO = 'https://app.notion.com/p/28216dcf716480f9a3ced0b72e30a2a9'; // fallback

const PLANET_URLS = {
  Mercury: p('1f516dcf716481259c74da97a6cd02bc'),
  Venus:   p('1f516dcf71648162b86bdab31c331af2'),
  Mars:    p('1f516dcf716481a6bec0f56b08a4bd22'),
  Jupiter: p('1f516dcf716481c1b361f64f8207961e'),
  Saturn:  p('1f516dcf716481daa4e1d870b84cadad'),
  Uranus:  ASTRO,
  Neptune: ASTRO,
  Pluto:   ASTRO,
};

const SYMBOLS = {
  Mercury:'☿', Venus:'♀', Mars:'♂', Jupiter:'♃',
  Saturn:'♄', Uranus:'⛢', Neptune:'♆', Pluto:'♇'
};

// Retrograde windows (start, end) — 2025–2027
const RETROGRADES = [
  // Mercury
  { planet:'Mercury', start:'2025-11-09', end:'2025-11-29' },
  { planet:'Mercury', start:'2026-03-15', end:'2026-04-07' },
  { planet:'Mercury', start:'2026-07-18', end:'2026-08-11' },
  { planet:'Mercury', start:'2026-11-11', end:'2026-12-01' },
  { planet:'Mercury', start:'2027-03-04', end:'2027-03-27' },
  // Venus
  { planet:'Venus',   start:'2025-03-01', end:'2025-04-12' },
  { planet:'Venus',   start:'2026-10-03', end:'2026-11-13' },
  // Mars
  { planet:'Mars',    start:'2024-12-06', end:'2025-02-23' },
  { planet:'Mars',    start:'2027-01-12', end:'2027-04-01' },
  // Jupiter
  { planet:'Jupiter', start:'2025-07-11', end:'2025-11-20' },
  { planet:'Jupiter', start:'2026-08-05', end:'2026-12-06' },
  // Saturn
  { planet:'Saturn',  start:'2025-07-13', end:'2025-11-27' },
  { planet:'Saturn',  start:'2026-07-27', end:'2026-12-05' },
  // Uranus
  { planet:'Uranus',  start:'2025-09-06', end:'2026-02-03' },
  { planet:'Uranus',  start:'2026-09-24', end:'2027-02-14' },
  // Neptune
  { planet:'Neptune', start:'2025-07-04', end:'2025-12-10' },
  { planet:'Neptune', start:'2026-07-18', end:'2026-12-23' },
  // Pluto
  { planet:'Pluto',   start:'2025-05-05', end:'2025-10-13' },
  { planet:'Pluto',   start:'2026-05-10', end:'2026-10-16' },
  { planet:'Pluto',   start:'2027-05-14', end:'2027-10-19' },
];

function renderRetrogrades() {
  const now = new Date();
  const today = new Date(now); today.setHours(0,0,0,0);

  const active = [], upcoming = [];

  for (const r of RETROGRADES) {
    const start = new Date(r.start);
    const end   = new Date(r.end);
    if (today >= start && today <= end) {
      const daysLeft = Math.ceil((end - today) / 86400000);
      active.push({ ...r, daysLeft, end });
    } else if (start > today) {
      const daysAway = Math.ceil((start - today) / 86400000);
      upcoming.push({ ...r, daysAway, start, end });
    }
  }

  // De-dupe upcoming by planet (keep soonest)
  const seenPlanet = new Set();
  const upcomingFiltered = [];
  for (const r of upcoming.sort((a,b) => a.start - b.start)) {
    if (!seenPlanet.has(r.planet)) {
      seenPlanet.add(r.planet);
      upcomingFiltered.push(r);
    }
  }

  const fmtDate = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric' });

  const activeEl = document.getElementById('activeRetro');
  const upcomingEl = document.getElementById('upcomingRetro');

  if (active.length === 0) {
    activeEl.innerHTML = `<div class="none-msg">No planets currently in retrograde.</div>`;
  } else {
    activeEl.innerHTML = `<div class="section-label" style="margin-bottom:8px">Currently Retrograde</div><div class="retro-list">${
      active.map(r => `
        <div class="retro-item">
          <div class="retro-planet">
            <span class="retro-symbol">${SYMBOLS[r.planet]}</span>
            <span class="retro-name">
              <a href="${PLANET_URLS[r.planet]}" target="_blank" rel="noopener noreferrer">${r.planet}</a>
              <span class="retro-badge">Rx</span>
            </span>
          </div>
          <div class="retro-meta">Direct ${fmtDate(r.end)}<br>${r.daysLeft}d remaining</div>
        </div>`).join('')
    }</div>`;
  }

  if (upcomingFiltered.length > 0) {
    document.getElementById('retroDivider').style.display = 'block';
    upcomingEl.innerHTML = `<div class="section-label" style="margin-bottom:8px">Upcoming</div><div class="retro-list">${
      upcomingFiltered.slice(0,4).map(r => `
        <div class="retro-item retro-upcoming">
          <div class="retro-planet">
            <span class="retro-symbol">${SYMBOLS[r.planet]}</span>
            <span class="retro-name">
              <a href="${PLANET_URLS[r.planet]}" target="_blank" rel="noopener noreferrer">${r.planet}</a>
            </span>
          </div>
          <div class="retro-meta">${fmtDate(r.start)} – ${fmtDate(r.end)}</div>
        </div>`).join('')
    }</div>`;
  }
}

renderMoon();
renderRetrogrades();
</script>
</body>
</html>
