   meaning:"The upright Two can mean good fortune as a result of your ability to handle many things at once. You manage to balance work and play and feel content with your situation. Sometimes it shows you have many resources at your disposal and know how to use them well.\n• In a reading about money, the upright Two may mean doubling your money. Perhaps by joining forces with a partner, you can profit more than you could alone. In some cases, this card indicates two sources of income.\n• If the reading is about your job, the Two can represent balancing work with downtime, you need both to stay happy and healthy. It can also indicate a busy period when you have to juggle projects or duties. Sometimes it suggests choosing between two job offers or opportunities.\n• In a reading about love, this card may represent shared resources or working with a romantic partner, perhaps running a business together. It can also mean you're trying to balance your work and domestic life. Sometimes it indicates a choice between two partners."},
  {name:"III of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Three represents expressing your creativity in a practical way and enjoying your work. You've developed your skills; now you gain rewards and recognition from applying your talents constructively. Other people too derive pleasure from what you do. This card can also encourage you to market a product, idea, or talent.\n• In a reading about money, this card indicates profiting from your work. You could think of it as the \"payback card\" when your efforts bear fruit. It may also show a financial endeavor coming to fruition or at least beginning to prosper.\n• If the reading is about your job, you're using your abilities fully and achieving success. What you create now should have lasting results you can be proud of and enjoy. The upright Three may signify the satisfactory completion of a project or job.\n• In a reading about love, you've worked through challenges and invested a lot of effort in a relationship. Now things are on the upswing and you can enjoy your relationship. Contentment and security are yours."},
  {name:"IV of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Four represents a practical, conservative attitude toward money and material goods. You place great value on wealth and possessions and take pride in your worth. Because security is important to you, you hold on tight to what you own and may hoard money rather than enjoying it. You could think of this as the \"miser card.\"\n• In a reading about money, this card can indicate a cautious, prudent attitude toward financial matters. You play it safe and devote yourself to accumulating wealth. The upright Four may signify a sound investment or a stable financial position.\n• If the reading is about your work, you've chosen a job that's secure and provides a good income, perhaps one in finance. Wealth gives you status and power, which you value. However, you may not feel inspired, challenged, or content in your position.\n• In a reading about love, the upright Four represents a stable, secure, structured relationship. The partnership may be based on status and money rather than love and may lack passion."},
  {name:"V of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"I think of this as the \"need card.\" You're in a pinch and need help, don't be too proud to ask for it. Usually the Five of Pentacles represents financial need, although it may point to a health issue or a disappointment in another physical area. Sometimes it suggests you're not using your resources wisely, you may not even be aware of your potential.\n• In a reading about money, the Five points to losses, financial woes, debt, and feelings of desperation. However, it can also indicate paring down your lifestyle and assessing what's really important. Perhaps spiritual things mean more to you than material ones.\n• If the reading is about your job, you may feel financially strapped because you're not earning enough to pay the bills. Work-related responsibilities may drain your vitality. Maybe it's time to look for a better job.\n• In a reading about love, the Five of Pentacles can mean a relationship is draining your energy, you're investing a lot and not getting much in return. This card suggests emotional poverty, limitations, and unhappiness."},
  {name:"VI of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Six heralds good times ahead, particularly in financial/material areas. You can profit from cooperative ventures, combining your talents and sharing resources for the greater good. This card can also represent philanthropic projects or providing work for other people. You could think of this as the \"win-win card.\"\n• In a reading about money, the upright Six can signify an opportunity to participate in a group venture that will profit everyone. Sometimes it points to acquiring a loan or other financial backing.\n• If the reading is about your job, the Six represents teamwork. You may participate in a group effort that uses your talents; combining your abilities or resources with others' promises success.\n• In a reading about love, the upright Six suggests sharing resources, financial and otherwise, with a partner so you both benefit. This give-and-take card encourages you to open up to what a partner offers, and vice versa."},
  {name:"VII of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Seven shows a venture or financial investment beginning to bear fruit. However, you may still need to put in more work and be patient, you haven't reached the end yet. As you appraise your \"crop,\" you may choose to prune the tree, discarding the lesser-quality fruit to improve your harvest.\n• In a reading about money, you're starting to see gains, but there's still room for growth. Don't give up. The Seven also warns against get-rich-quick schemes. Use prudence.\n• If the reading is about your job, the upright Seven shows you advancing in your career and advises you to continue applying effort. What you do now will impact future results.\n• In a reading about love, you may feel a relationship is taking too long to warm up or that you're not making much progress. However, the upright Seven encourages you to continue taking small steps, little by little things are improving."},
  {name:"VIII of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Eight heralds success in an endeavor. You've honed your skills to a high level, and you're totally focused on your purpose. Because you pursue your objective with sincerity, clarity, and determination, your efforts reap rewards.\n• In a reading about money, this card can represent receiving a raise, landing a well-paying job, or profiting from a venture. Do what's necessary to reach your financial goal.\n• If the reading is about your job, the upright Eight says your craftsmanship will be rewarded with recognition and respect. You're immersing yourself in your work in order to get ahead; with continued effort you'll succeed. Sometimes this card means you can benefit from gaining additional skills.\n• In a reading about love, you realize a relationship takes work, and you're willing to put forth the necessary effort. You and your partner take a mature attitude toward your relationship and are dedicated to each other. Sometimes this card represents love coming late in life."},
  {name:"IX of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"Nines represent fulfillment, and this lovely card says you've arrived. You've achieved your goals and now feel secure. You've worked hard, used your skills and acumen, and accomplished much, you have reason to be proud. The upright Nine also represents independence, you've created the life you desire and can now enjoy your success.\n• In a reading about money, this card indicates you have plenty and no longer need to worry about financial security. Enjoy the fruits of your labors, you've earned them. The vineyard can also suggest acquiring property or earning a nice profit from selling property.\n• If the reading is about your job, the upright Nine indicates a time of success and recognition. You've reached a position of security and respect, and feel proud of your achievement. Perhaps you now have more independence or free time; sometimes this card can signify retirement.\n• In a reading about love, this card shows a secure, comfortable, pleasant relationship, or, conversely, it says you're content to be alone and don't need a partner. This Nine may symbolize a relationship that offers financial abundance and ease without limiting your freedom."},
  {name:"X of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Ten promises pleasure, abundance, and security in your professional and domestic life. You enjoy your work and your family, and your income allows you to provide for loved ones. Comfortable in your financial position, you can now devote yourself to leisure activities or perhaps philanthropic ventures.\n• In a reading about money, the upright Ten points to prosperity and stability in money matters. Sometimes it represents family money, an inheritance, or marrying into money. It can also mean profiting from an investment, particularly one involving property.\n• If the reading is about your job, this card may mean working in a family business. Your job provides security, wealth, and worldly success, and you enjoy what you do. Perhaps you work in real estate, farming, or another property-related occupation. In some cases, the upright Ten represents a philanthropic venture or business that helps others.\n• In a reading about love, this Ten indicates a happy, successful, secure family life. Maybe you now feel financially stable enough or mature enough to start a family. Or, you may marry into a wealthy family."},
  {name:"Page of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The Page of Pentacles can point to the everyday details of your life and advise you to take care of them. This may refer to your work, possessions, or health. In some cases, this card may indicate naiveté in financial or practical areas, you're learning how to live in the real world. The Page can also show you performing a service for someone.\n• In a reading about money, this card may refer to contracts or other paperwork related to money, possessions, or property. The Page upright may describe the early stages of a project, when you're discussing possibilities, seeking financial support, or laying the groundwork. You're advised to learn all you can about a money matter.\n• If the reading is about your job, you may be preparing yourself for a career or a career change. A position in business, healthcare, or the trades could be profitable. The Page advises you to work hard and learn all you can, in order to reach your goal.\n• In a reading about love, you may be more concerned with security, stability, and the practical aspects of a relationship than with romance. This card can also indicate meeting a partner through work."},
  {name:"Knight of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"If this Knight represents a real-life person, he's not a flashy or adventurous or even a particularly creative guy, but you can depend on him, and he's willing to do what's necessary to bring his goals to fruition. Money, possessions, and status mean a lot to him. He often succeeds through determination and effort, not inspiration or genius. Symbolically, this card speaks of perseverance, dedication, loyalty, and steadiness in the face of change or turmoil.\n• In a reading about money, you may receive information about money matters or an investment. This card can also indicate profiting from a practical investment or endeavor or selling property. Be content with slow gains rather than sudden windfalls.\n• If the reading is about your job, the upright Knight can mean changing jobs for a more financially lucrative position or traveling for business. Sometimes he represents a career in finance or one connected with farming, real estate, construction, or manufacturing.\n• In a reading about love, this Knight indicates stability, practicality, and loyalty. He may not be the most romantic or inspired lover, but you can rely on him. This card can also point to a relationship based on security, financial or otherwise."},
  {name:"Queen of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"The upright Queen suggests financial savvy and a keen understanding of the material world. When she appears, she indicates success in an area involving money or other resources. An undertaking should bear fruit if nurtured carefully. This is a \"harvest card.\" If the Queen represents an actual person, she's a practical, wise, generous individual with a sensual side, she's at home in her body and enjoys her creature comforts.\n• In a reading about money, the upright Queen suggests using money and resources creatively and constructively. She can also indicate a financial partnership or sharing resources with others.\n• If the reading is about your job, this card can represent teamwork or a work-related partnership. It may show you bringing your creativity into a business matter. You nurture your own talents and help others develop their skills.\n• In a reading about love, the Queen suggests a mature, sincere relationship. You enjoy sensual and sexual pleasure, creature comforts, financial security, and the good things in life."},
  {name:"King of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"When the King of Pentacles appears upright, he signifies a practical matter, finances, property, career/work, common sense, and security. If he represents a real person, it's someone who's a pillar of the community, a business leader, a person of wealth and substance, perhaps your boss or father. You can depend on him for support or advice in practical areas.\n• In a reading about money, this card shows you're in a secure position financially. An investment should pay off, or you're advised to go ahead with a money matter you're considering. Good organization and practicality will benefit you.\n• If the reading is about your job, the King shows success coming to you. Your position is stable, and you're using your resources wisely. You can take the lead in a business venture.\n• In a reading about love, this card indicates a mature, stable relationship in which you support one another. Sometimes it shows a relationship based on money, status, or security."}
];

const back = document.getElementById('cardBack');
const pullStage = document.getElementById('pullStage');
const resultStage = document.getElementById('resultStage');

function draw(){
  const c = CARDS[Math.floor(Math.random()*CARDS.length)];
  document.getElementById('csymbol').textContent = c.symbol;
  document.getElementById('cname').textContent = c.name;
  document.getElementById('csuit').textContent = c.suit;
  document.getElementById('cmeaning').textContent = c.meaning;
  pullStage.style.display = 'none';
  resultStage.classList.add('show');
}

back.addEventListener('click', draw);
document.getElementById('again').addEventListener('click', () => {
  resultStage.classList.remove('show');
  pullStage.style.display = 'block';
});
</script>
</body>
</html>
