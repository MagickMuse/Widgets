<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot Pull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff1d4; --rose:#cc5353; --crimson:#a82222; --maroon:#a62524;
    --dark:#2a1f1f; --darker:#3d2b2b; --muted:#c9a98f; --notion:#E03E3E;
  }
  *{box-sizing:border-box;}
  html,body{background:#1e1515;}
  body{margin:0;font-family:'EB Garamond',serif;color:var(--cream);padding:24px 16px;min-height:100vh;display:flex;justify-content:center;}
  .wrap{max-width:440px;width:100%;text-align:center;}
  h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.8rem;font-style:italic;margin-bottom:28px;}

  /* ── Fan Spread ──────────────────────────────────────── */
  .spread-area{position:relative;height:230px;width:100%;margin-bottom:8px;}
  .fc{
    position:absolute;bottom:0;left:50%;
    transform-origin:bottom center;
    transform:translateX(calc(-60px + var(--tx))) rotate(var(--r));
    transition:transform .2s ease,opacity .3s ease;
    cursor:pointer;
    width:120px;
  }
  .fc:hover .card-shell{box-shadow:0 0 0 2px var(--rose),0 8px 28px rgba(204,83,83,.35);transform:translateY(-14px);}
  .fc.fading{opacity:0;pointer-events:none;}
  .card-shell{
    width:120px;height:190px;border-radius:10px;
    background:radial-gradient(ellipse at 35% 30%, #4a3535, #2a1f1f 60%, #1a1212);
    border:2px solid var(--maroon);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
    transition:box-shadow .2s,transform .2s;
    position:relative;
    overflow:hidden;
  }
  .card-shell::before{
    content:'';position:absolute;inset:8px;
    border:1px solid rgba(166,37,36,.35);border-radius:6px;
    pointer-events:none;
  }
  .card-shell .bs{font-size:1.8rem;color:var(--rose);line-height:1;}
  .card-shell .bl{font-family:'Cinzel Decorative',serif;font-size:.42rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;}
  .card-shell .bdiv{width:32px;height:1px;background:rgba(166,37,36,.4);margin:1px auto;}
  .prompt{color:var(--muted);font-size:.85rem;margin-top:6px;font-style:italic;}

  /* ── Flip Reveal ─────────────────────────────────────── */
  #revealStage{display:none;}
  .flip-scene{perspective:1000px;width:140px;height:220px;margin:0 auto 20px;}
  .flip-card{
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .75s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  .flip-card.flipped{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:10px;
    overflow:hidden;
    border:2px solid var(--maroon);
  }
  .flip-back{
    background:radial-gradient(ellipse at 35% 30%, #4a3535, #2a1f1f 60%, #1a1212);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    position:relative;
  }
  .flip-back::before{content:'';position:absolute;inset:10px;border:1px solid rgba(166,37,36,.35);border-radius:7px;}
  .flip-back .bs{font-size:2.2rem;color:var(--rose);}
  .flip-back .bl{font-family:'Cinzel Decorative',serif;font-size:.45rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;}
  .flip-back .bdiv{width:36px;height:1px;background:rgba(166,37,36,.4);margin:2px auto;}
  .flip-front{transform:rotateY(180deg);background:#111;}
  .flip-front img{width:100%;height:100%;object-fit:cover;display:block;}
  .flip-front img.reversed{transform:rotate(180deg);transform-origin:center center;}
  .flip-front .fallback{
    width:100%;height:100%;
    background:radial-gradient(ellipse at 35% 30%, #4a3535, #2a1f1f 60%, #1a1212);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:16px;
  }
  .flip-front .fallback .fg{font-size:2.5rem;color:var(--notion);}
  .flip-front .fallback .fn{font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.04em;color:var(--cream);text-align:center;}

  /* ── Card Details ────────────────────────────────────── */
  .reveal-details{animation:fadeUp .5s ease both;animation-delay:.6s;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .card-name{font-family:'Cinzel Decorative',serif;font-size:1.2rem;letter-spacing:.04em;color:var(--cream);line-height:1.3;margin-bottom:4px;}
  .card-suit{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
  .orient-badge{display:inline-block;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 12px;border-radius:20px;margin-bottom:14px;}
  .orient-badge.upright{background:rgba(224,62,62,.15);color:var(--notion);border:1px solid rgba(224,62,62,.35);}
  .orient-badge.reversed{background:rgba(201,169,143,.1);color:var(--muted);border:1px solid rgba(201,169,143,.3);}
  .keywords-box{background:linear-gradient(160deg,var(--darker),var(--dark));border:1px solid var(--maroon);border-radius:10px;padding:14px 18px;text-align:left;margin-bottom:14px;}
  .keywords-box h3{margin:0 0 6px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--notion);font-weight:normal;}
  .keywords-box .kw{font-size:1.05rem;line-height:1.5;color:var(--cream);}
  .btn-row{display:flex;gap:8px;}
  .grimoire-btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:transparent;border:1px solid var(--maroon);color:var(--muted);
    padding:8px 14px;border-radius:6px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.82rem;letter-spacing:.03em;
    text-decoration:none;transition:background .15s,color .15s,border-color .15s;
  }
  .grimoire-btn:hover{background:rgba(224,62,62,.12);color:var(--cream);border-color:var(--notion);}
  .grimoire-btn svg{width:13px;height:13px;opacity:.7;flex-shrink:0;}
  .again-btn{
    flex:1;background:transparent;border:1px solid var(--maroon);color:var(--cream);
    padding:8px 14px;border-radius:6px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.85rem;letter-spacing:.03em;
    transition:background .15s,border-color .15s;
  }
  .again-btn:hover{background:var(--notion);border-color:var(--notion);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tarot Pull</h1>
  <div class="sub">Rider-Waite &middot; upright &amp; reversed</div>

  <div id="spreadStage">
    <div class="spread-area" id="spread"></div>
    <p class="prompt">Choose a card</p>
  </div>

  <div id="revealStage">
    <div class="flip-scene">
      <div class="flip-card" id="flipCard">
        <div class="flip-face flip-back">
          <span class="bs">✦</span>
          <span class="bl">Magick</span>
          <div class="bdiv"></div>
          <span class="bl">Muse</span>
        </div>
        <div class="flip-face flip-front" id="flipFront"></div>
      </div>
    </div>
    <div class="reveal-details">
      <div class="card-name" id="cname"></div>
      <div class="card-suit" id="csuit"></div>
      <span class="orient-badge" id="corient"></span>
      <div class="keywords-box">
        <h3 id="kwLabel">Keywords</h3>
        <div class="kw" id="ckeywords"></div>
      </div>
      <div class="btn-row">
        <a class="grimoire-btn" id="cgrimoire" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="1" width="10" height="13" rx="1"/>
            <line x1="4" y1="5" x2="9" y2="5"/>
            <line x1="4" y1="8" x2="9" y2="8"/>
            <line x1="4" y1="11" x2="7" y2="11"/>
          </svg>
          View in Grimoire
        </a>
        <button class="again-btn" id="again">Draw again</button>
      </div>
    </div>
  </div>
</div>

const IMG_BASE = 'https://www.sacred-texts.com/tarot/pkt/img/';
const MAJOR_NUM = {
  'Fool':'00','Magician':'01','High':'02','Empress':'03','Emperor':'04',
  'Hierophant':'05','Lovers':'06','Chariot':'07','Strength':'08','Hermit':'09',
  'Wheel':'10','Justice':'11','Hanged':'12','Death':'13','Temperance':'14',
  'Devil':'15','Tower':'16','Star':'17','Moon':'18','Sun':'19',
  'Judgement':'20','World':'21'
};
const MINOR_NUM = {
  'Ace':'01','II':'02','III':'03','IV':'04','V':'05','VI':'06','VII':'07',
  'VIII':'08','IX':'09','X':'10','Page':'11','Knight':'12','Queen':'13','King':'14'
};
const SUIT_CODE = {Wands:'wa',Cups:'cu',Swords:'sw',Pentacles:'pe'};

function cardImg(card) {
  if (card.suit === 'Major Arcana') {
    const bare = card.name.replace(/^The /, '');
    const key = bare.split(' ')[0];
    const num = MAJOR_NUM[key];
    if (!num) return '';
    return IMG_BASE + 'ar' + num + '.jpg';
  }
  const s = SUIT_CODE[card.suit];
  const firstWord = card.name.split(' ')[0];
  const num = MINOR_NUM[firstWord];
  if (!s || !num) return '';
  return IMG_BASE + s + num + '.jpg';
}

function toNotionUrl(raw) {
  const hex = raw.split('?')[0].split('/').pop();
  if (hex.includes('-')) return 'https://www.notion.so/' + hex;
  return `https://www.notion.so/${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}

const ANGLES = [-27, -18, -9, 0, 9, 18, 27];
const OFFSETS = [-105, -70, -35, 0, 35, 70, 105];

function buildSpread() {
  const spread = document.getElementById('spread');
  spread.innerHTML = '';
  ANGLES.forEach((angle, i) => {
    const fc = document.createElement('div');
    fc.className = 'fc';
    fc.style.cssText = `--r:${angle}deg;--tx:${OFFSETS[i]}px`;
    fc.innerHTML = `<div class="card-shell"><span class="bs">✦</span><span class="bl">Magick</span><div class="bdiv"></div><span class="bl">Muse</span></div>`;
    fc.addEventListener('click', () => pickCard(fc));
    spread.appendChild(fc);
  });
}

let drawn = null;
let isReversed = false;

function pickCard(clickedFc) {
  drawn = CARDS[Math.floor(Math.random() * CARDS.length)];
  isReversed = Math.random() < 0.5;

  const allFc = document.querySelectorAll('.fc');
  allFc.forEach(fc => {
    if (fc !== clickedFc) fc.classList.add('fading');
  });

  setTimeout(() => {
    document.getElementById('spreadStage').style.display = 'none';
    showReveal();
    document.getElementById('revealStage').style.display = 'block';
    setTimeout(() => {
      document.getElementById('flipCard').classList.add('flipped');
    }, 120);
  }, 400);
}

function showReveal() {
  const c = drawn;
  const rev = isReversed;

  const front = document.getElementById('flipFront');
  const imgSrc = cardImg(c);
  if (imgSrc) {
    const img = document.createElement('img');
    img.src = imgSrc;
    if (rev) img.classList.add('reversed');
    img.onerror = () => {
      front.innerHTML = '';
      const fb = document.createElement('div');
      fb.className = 'fallback';
      fb.innerHTML = `<span class="fg">${c.symbol}</span><span class="fn">${c.name}</span>`;
      front.appendChild(fb);
    };
    front.innerHTML = '';
    front.appendChild(img);
  } else {
    front.innerHTML = `<div class="fallback"><span class="fg">${c.symbol}</span><span class="fn">${c.name}</span></div>`;
  }

  document.getElementById('cname').textContent = c.name;
  document.getElementById('csuit').textContent = c.suit + (c.suit !== 'Major Arcana' ? ' · ' + c.symbol : '');
  const ob = document.getElementById('corient');
  ob.textContent = rev ? 'Reversed' : 'Upright';
  ob.className = 'orient-badge ' + (rev ? 'reversed' : 'upright');
  document.getElementById('kwLabel').textContent = rev ? 'Reversed Keywords' : 'Upright Keywords';
  document.getElementById('ckeywords').textContent = rev ? c.reversed : c.upright;
  document.getElementById('cgrimoire').href = toNotionUrl(c.url);
}

document.getElementById('again').addEventListener('click', () => {
  document.getElementById('flipCard').classList.remove('flipped');
  document.getElementById('revealStage').style.display = 'none';
  document.getElementById('spreadStage').style.display = 'block';
  document.getElementById('flipFront').innerHTML = '';
  drawn = null;
  buildSpread();
});

buildSpread();
</script>
