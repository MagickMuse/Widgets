<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot Pull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>

    --cream:#fff1d4; --rose:#cc5353; --crimson:#a82222; --maroon:#a62524;
    --dark:#2a1f1f; --darker:#3d2b2b; --muted:#c9a98f; --notion:#E03E3E;
  }
  *{box-sizing:border-box;}
  html,body{background:transparent;}
  body{margin:0;font-family:'EB Garamond',serif;color:var(--cream);padding:20px;min-height:100vh;display:flex;justify-content:center;}
  .wrap{max-width:420px;width:100%;text-align:center;}
  h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.8rem;font-style:italic;margin-bottom:22px;}
  .stage{min-height:280px;display:flex;align-items:center;justify-content:center;}
  .card-back{
    width:120px;height:190px;border-radius:10px;
    background:radial-gradient(circle at 35% 30%, var(--darker), var(--dark));
    border:2px solid var(--maroon);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 28px rgba(0,0,0,.4);
    font-size:2.4rem;color:var(--rose);transition:transform .15s,box-shadow .15s;
    flex-direction:column;gap:6px;
  }
  .card-back:hover{transform:scale(1.04);box-shadow:0 8px 32px rgba(204,83,83,.25);}
  .card-back .back-symbol{font-size:1.8rem;color:var(--rose);}
  .card-back .back-label{font-family:'Cinzel Decorative',serif;font-size:.55rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .result{display:none;}
  .result.show{display:block;}
  .card-symbol{font-size:2.8rem;color:var(--notion);display:block;text-shadow:0 0 24px rgba(224,62,62,.3);transition:transform .3s;}
  .card-symbol.reversed{transform:rotate(180deg);}
  .card-name{font-family:'Cinzel Decorative',serif;font-size:1.25rem;letter-spacing:.04em;color:var(--cream);line-height:1.3;margin-top:6px;}
  .card-suit{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin:4px 0 8px;}
  .orientation{display:inline-block;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 10px;border-radius:20px;margin-bottom:14px;font-family:'EB Garamond',serif;}
  .orientation.upright{background:rgba(224,62,62,.15);color:var(--notion);border:1px solid rgba(224,62,62,.35);}
  .orientation.reversed{background:rgba(201,169,143,.1);color:var(--muted);border:1px solid rgba(201,169,143,.3);}
  .keywords-card{background:linear-gradient(160deg,var(--darker),var(--dark));border:1px solid var(--maroon);border-radius:10px;padding:14px 18px;text-align:left;}
  .keywords-card h3{margin:0 0 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--notion);font-weight:normal;}
  .keywords{font-size:1.1rem;line-height:1.5;color:var(--cream);}
  .grimoire-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:14px;background:transparent;border:1px solid var(--maroon);
    color:var(--muted);padding:7px 16px;border-radius:6px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.82rem;letter-spacing:.03em;
    text-decoration:none;transition:background .15s,color .15s,border-color .15s;
  }
  .grimoire-btn:hover{background:rgba(224,62,62,.12);color:var(--cream);border-color:var(--notion);}
  .grimoire-btn svg{width:13px;height:13px;opacity:.7;flex-shrink:0;}
  .again{margin-top:10px;display:block;width:100%;background:transparent;border:1px solid var(--maroon);color:var(--cream);padding:8px;border-radius:6px;cursor:pointer;font-family:'EB Garamond',serif;font-size:.85rem;letter-spacing:.03em;transition:background .15s;}
  .again:hover{background:var(--notion);border-color:var(--notion);}
  .prompt{color:var(--muted);font-size:.85rem;margin-top:14px;}
  .btn-row{display:flex;gap:8px;margin-top:14px;}
  .btn-row .grimoire-btn{flex:1;justify-content:center;}
  .btn-row .again{flex:1;margin-top:0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tarot Pull</h1>
  <div class="sub">Rider-Waite &middot; draw a single card, upright or reversed</div>
  <div class="stage">
    <div id="pullStage">
      <div>
        <div class="card-back" id="cardBack">

        </div>
        <div class="prompt">Tap the card to draw</div>
      </div>
    </div>
    <div class="result" id="resultStage">
      <span class="card-symbol" id="csymbol"></span>
      <div class="card-name" id="cname"></div>
      <div class="card-suit" id="csuit"></div>
      <span class="orientation" id="corient"></span>
      <div class="keywords-card">
        <h3 id="kw-label">Keywords</h3>
        <div class="keywords" id="ckeywords"></div>
      </div>
      <div class="btn-row">

          </svg>
          View in Grimoire
        </a>
        <button class="again" id="again">Draw again</button>
      </div>
    </div>
  </div>
</div>

const back = document.getElementById('cardBack');
const pullStage = document.getElementById('pullStage');
const resultStage = document.getElementById('resultStage');

function draw(){
  const c = CARDS[Math.floor(Math.random()*CARDS.length)];
  const isReversed = Math.random() < 0.5;

  const sym = document.getElementById('csymbol');
  sym.textContent = c.symbol;
  sym.className = 'card-symbol' + (isReversed ? ' reversed' : '');

  document.getElementById('cname').textContent = c.name;
  document.getElementById('csuit').textContent = c.suit;

  const orient = document.getElementById('corient');
  orient.textContent = isReversed ? 'Reversed' : 'Upright';
  orient.className = 'orientation ' + (isReversed ? 'reversed' : 'upright');

  document.getElementById('kw-label').textContent = isReversed ? 'Reversed Keywords' : 'Upright Keywords';
  document.getElementById('ckeywords').textContent = isReversed ? c.reversed : c.upright;

  document.getElementById('cgrimoire').href = c.url;

  pullStage.style.display = 'none';
  resultStage.classList.add('show');
}

back.addEventListener('click', draw);
document.getElementById('again').addEventListener('click', () => {
  resultStage.classList.remove('show');
  pullStage.style.display = 'block';
});
