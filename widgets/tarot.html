<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot Pull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff1d4; --rose:#cc5353; --crimson:#a82222; --maroon:#a62524;
    --dark:#2a1f1f; --darker:#3d2b2b; --muted:#c9a98f; --notion:#E03E3E;
  }
  *{box-sizing:border-box;}
  html,body{background:transparent;}
  body{margin:0;font-family:'EB Garamond',serif;color:var(--cream);padding:20px;min-height:100vh;display:flex;justify-content:center;}
  .wrap{max-width:440px;width:100%;text-align:center;}
  h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.8rem;font-style:italic;margin-bottom:22px;}
  .stage{min-height:280px;display:flex;align-items:center;justify-content:center;}
  .card-back{
    width:120px;height:190px;border-radius:10px;
    background:radial-gradient(circle at 35% 30%, var(--darker), var(--dark));
    border:2px solid var(--maroon);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 28px rgba(0,0,0,.4);
    font-size:2.4rem;color:var(--rose);transition:transform .15s,box-shadow .15s;
    flex-direction:column;gap:6px;
  }
  .card-back:hover{transform:scale(1.04);box-shadow:0 8px 32px rgba(204,83,83,.25);}
  .card-back .back-symbol{font-family:'Cinzel Decorative',serif;font-size:1.8rem;color:var(--rose);}
  .card-back .back-label{font-family:'Cinzel Decorative',serif;font-size:.55rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
  .result{display:none;}
  .result.show{display:block;}
  .card-suit-symbol{font-size:2.8rem;color:var(--notion);margin-bottom:4px;display:block;text-shadow:0 0 24px rgba(224,62,62,.3);}
  .card-name{font-family:'Cinzel Decorative',serif;font-size:1.3rem;letter-spacing:.04em;color:var(--cream);line-height:1.3;}
  .card-suit{color:var(--notion);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;margin:4px 0 16px;}
  .meaning-card{background:linear-gradient(160deg,var(--darker),var(--dark));border:1px solid var(--maroon);border-radius:10px;padding:16px 18px;margin-top:4px;text-align:left;max-height:320px;overflow-y:auto;}
  .meaning-card h3{margin:0 0 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--notion);font-weight:normal;}
  .meaning-card p{margin:0;font-size:.92rem;line-height:1.6;white-space:pre-wrap;}
  .again{margin-top:18px;background:transparent;border:1px solid var(--maroon);color:var(--cream);padding:8px 18px;border-radius:6px;cursor:pointer;font-family:'EB Garamond',serif;font-size:.85rem;letter-spacing:.03em;transition:background .15s;}
  .again:hover{background:var(--notion);border-color:var(--notion);}
  .prompt{color:var(--muted);font-size:.85rem;margin-top:14px;}
  .meaning-card::-webkit-scrollbar{width:4px;}
  .meaning-card::-webkit-scrollbar-track{background:transparent;}
  .meaning-card::-webkit-scrollbar-thumb{background:var(--maroon);border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tarot Pull</h1>
  <div class="sub">Rider-Waite &middot; draw a single card for guidance</div>
  <div class="stage">
    <div id="pullStage">
      <div>
        <div class="card-back" id="cardBack">
          <span class="back-symbol">✦</span>
          <span class="back-label">Draw</span>
        </div>
        <div class="prompt">Tap the card to draw</div>
      </div>
    </div>
    <div class="result" id="resultStage">
      <span class="card-suit-symbol" id="csymbol"></span>
      <div class="card-name" id="cname"></div>
      <div class="card-suit" id="csuit"></div>
      <div class="meaning-card">
        <h3>Upright Reading</h3>
        <p id="cmeaning"></p>
      </div>
      <button class="again" id="again">Draw again</button>
    </div>
  </div>
</div>

<script>
const CARDS = [
  // ── Major Arcana ──────────────────────────────────────────────────────
  {name:"The Fool",suit:"Major Arcana",symbol:"✦",
   meaning:"When The Fool appears in a reading, it usually means you're about to embark on a new way of life. You're open to new experiences and to discovering what lies around the bend. Even if you're not sure about the path you've chosen, you have faith that everything will turn out well. You probably feel out of sync with the rest of the world, but in a good way. You hear the beat of a different drummer, and you're ready to march to it.\n• In a reading about money, The Fool urges caution. You may be too trusting, or you may be naive when it comes to handling financial matters. This card can also represent the first stage of a business or investment, examine details carefully. Pay attention to your intuition, not only logic.\n• If the reading is about your work, The Fool can indicate starting a new job, project, or business venture; beginning a course of study; or going on a business trip. You're looking forward to this adventure or new direction and its possibilities. Embrace the opportunity with an open mind, you have a lot to learn.\n• In a reading about love, this card often means beginning a romance or moving into a new stage in an existing partnership. A new relationship may feel \"fated,\" as if you've met your soulmate. Enjoy this period of joy, openness, and excitement."},
  {name:"The Magician",suit:"Major Arcana",symbol:"✦",
   meaning:"The Magician recommends getting in touch with the unseen world instead of focusing only on the material one, they aren't separate, and what we usually think of as \"reality\" is an illusion. The presence of the four magick tools on this card suggests that everything you need is right there at your fingertips. You're connecting with your power and aligning yourself with universal forces to achieve your goals and desires.\n• In a reading about money, The Magician tells you to tap into the universal flow to attract abundance. You possess the resources, inner and outer, to generate wealth. This card can also advise you to take control of a financial matter.\n• If the reading is about your job, this card encourages you to use your spiritual and physical resources correctly to take command of your life and master the circumstances around you. Trust yourself and your inner guidance. The Magician can also symbolize a position in a spiritual field or studying spiritual wisdom.\n• In a reading about love, this card may represent a relationship that contains a strong spiritual or magickal element. You and a partner may be on a spiritual path together, encouraging and inspiring one another."},
  {name:"The High Priestess",suit:"Major Arcana",symbol:"✦",
   meaning:"The High Priestess may advise paying attention to your inner world, dreams, imagination, and intuition, especially if you tend to be a logical, practical person. Look more deeply at your hidden talents and motivations, face your \"shadow,\" and reconcile your inner life with your outer one. Upright, The High Priestess suggests inner changes are taking place even if they haven't materialized yet. Something hidden is about to come forth.\n• In a reading about money, you may be too \"otherworldly\" or impractical in financial areas; perhaps you need to get a handle on spending. The High Priestess can also advise listening to your intuition in an issue involving money.\n• If the reading is about your job, this card recommends tuning in to \"the invisible world\" and taking advantage of your inner knowing and the spiritual guidance available to you. It can also mean working in a field that uses your inner power, intuition, and wisdom, such as psychology, holistic healing, or a spiritual path.\n• In a reading about love, The High Priestess may describe a person who's intuitive, spiritual, in touch with the higher realms of existence. She can also represent a very romantic relationship that may not be well grounded in reality."},
  {name:"The Empress",suit:"Major Arcana",symbol:"✦",
   meaning:"The Empress represents strong feminine energy and may describe a mother figure or a mature artistic/creative person. Whether she rules the home or a business, she represents female authority. A card of fertility, she signifies abundance of all kinds and shows your capacity for nurturing, caring, and supporting others as well as yourself. Sometimes this card refers to your own mother. In a man's reading, The Empress may encourage him to recognize the feminine component in himself.\n• In a reading about money, The Empress indicates good fortune and success, you possess abundant resources and know how to use them productively. She can also recommend joining resources with a partner or group to increase financial gains.\n• If the reading is about work, you're involved in a creative project and giving it your all, and success is likely. She may show that you've got things under control or advise you to take charge and work congenially toward a common goal. The Empress's message to you is find harmony, unite disparate factors, and reconcile differences for the good of all.\n• In a reading about love, this card symbolizes a mature, loving relationship based on mutual respect, trust, and affection. It also indicates a powerful sexual connection. In some cases, The Empress may refer to a pregnancy or the desire for a pregnancy."},
  {name:"The Emperor",suit:"Major Arcana",symbol:"✦",
   meaning:"When The Emperor appears in a reading, look for issues related to authority. Although The Emperor represents worldly power, he's not a despot or tyrant, he wants the best for everyone. He's a symbol of responsibility, intelligence, and courage who fights for what he believes in. As such, he's a protective male figure who teaches how to govern wisely in this world. He may also describe your own father and your relationship to him.\n• In a reading about money, you possess the resources and savvy to succeed financially. You're good at making and managing money, you may even work in a financial field. The Emperor can represent success in a business or legal matter.\n• If the reading is about your job, The Emperor shows you're handling responsibilities in professional life successfully. You're a capable, confident leader, and other people look up to you. You strive to produce something of lasting value and importance in the material world. Sometimes this card encourages you to become the authority, to take charge rather than following someone else's rule.\n• In a reading about love, The Emperor symbolizes a mature, stable relationship, perhaps one based more on practical concerns, money, or status than passion. He indicates loyalty and commitment in a partnership."},
  {name:"The Hierophant",suit:"Major Arcana",symbol:"✦",
   meaning:"Upright, The Hierophant says you choose to live according to the beliefs you share with a group or organization. It serves you in many ways, you derive security from knowing the rules and where you fit in. Allying yourself with this group helps you achieve your goals. You might even be the leader, aspire to assume that position, or have a close relationship with the leader.\n• In a reading about money, you probably hold traditional ideas about money and resources. Perhaps you could profit from allying yourself with an established group or a religious organization. Sometimes this card suggests paying more attention to spiritual considerations instead of being so focused on material matters.\n• If the reading is about your job, The Hierophant indicates you must follow the rules if you want to succeed. Sometimes he represents a rigid corporate structure, religious organization, or educational system. Or, you may hold a position that uses your spiritual knowledge and interests.\n• In a reading about love, this card may signify a relationship based on traditions, structure, or a spiritual path. You and a partner may be dedicated to serving a higher cause, and your relationship supports your goal."},
  {name:"The Lovers",suit:"Major Arcana",symbol:"✦",
   meaning:"This is a card of cooperation, of working together with others to accomplish a joint purpose. When it appears upright, it signifies an attraction and partnership of some kind, not only the romantic variety. It can also suggest you're uniting disparate parts of yourself. The Lovers represents a period of harmony, in personal or professional matters. Sometimes it indicates you need to make a choice between two things you value, but you'll make the right decision.\n• In a reading about money, you can profit from combining your resources with someone else's. Sometimes The Lovers symbolizes benefitting from a partner's money or marrying into wealth. If you're seeking a financial backer, this card gives you a thumbs-up.\n• If the reading is about your job, this card represents a time of cooperation, contentment, and harmony. Joint projects are favored now. Two forces have united toward a common goal. The Lovers can also signify meeting a partner through work or working with a romantic partner in a business.\n• In a reading about love, this card bodes well for a romantic relationship. It shows mutual caring and attraction, a rewarding partnership that brings out the best in both people. Sometimes it means a decision in connection with a love relationship."},
  {name:"The Chariot",suit:"Major Arcana",symbol:"✦",
   meaning:"Upright, The Chariot symbolizes taking control of competing forces, whether these are inner conflicts, people, or a situation in your life, in order to reach your goals. You're being carried toward your destination as quickly as possible. Whatever the task, you can handle it. You're keeping up with the changes that are happening, at your job, in a relationship, or in some type of community or worldly involvement.\n• In a reading about money, this card says you can't rush things. All you can do is hold on to the reins and guide the situation, using your willpower and mastery to bring a financial matter to a successful conclusion.\n• If the reading is about your job, The Chariot reminds you that to succeed you need self-mastery. You possess the means to triumph over obstacles and stay the course you've set for yourself. You're holding things together successfully, uniting opposing forces to stay on track. However, you may be required to make frequent adjustments to continue going in the right direction.\n• In a reading about love, this card recommends spending time in self-development rather than chasing after love. This may not be the right time to start a romance. If you're in a relationship already, you may need to take control of conflicting feelings or attitudes to bring about harmony."},
  {name:"Justice",suit:"Major Arcana",symbol:"✦",
   meaning:"The Justice card tells you to look to your inner self for guidance, don't rely solely on human advisers. Deliberate calmly and carefully, weigh all the factors, before taking action or reaching a decision. If you're involved in a legal matter and Justice appears upright, you can expect things to proceed smoothly, fairly, and in an objective manner. Sometimes Justice says you need to right a wrong or rectify a matter. A card of karma, it suggests you're reaping what you've sown. Or, it may advise you to become more balanced, temperate, or fair-minded.\n• In a reading about money, Justice upright can symbolize a legal matter in which property is divided equitably or a fair financial settlement is reached. It can also mean sharing wealth or earning money through honest means.\n• If the reading is about your job, Justice can mean reaching an amicable agreement or signing a contract. This card upright can also represent a time of cooperation and harmony, when problems can be resolved. Seek an equitable division of labor, responsibilities, and rewards.\n• In a reading about love, this card advises you to seek balance and fairness in a relationship. One of you may need to adjust your behavior to create a more equitable situation. Sometimes Justice indicates a contractual agreement or legal arrangement, such as marriage."},
  {name:"The Hermit",suit:"Major Arcana",symbol:"✦",
   meaning:"Remember the saying, \"When the student is ready, the teacher appears\"? When this card is upright, you may be looking for guidance from the invisible world. You want to gain perspective on your life, and you're open to the inner guidance that's available to you. The time has come to reunite with the Source, whether for guidance, to discover the truth, or to establish inner balance.\n• In a reading about money, The Hermit offers guidance in a financial matter. He may encourage you to seek counsel from someone wiser or more experienced than yourself. Sometimes this card represents turning away from material things to follow a spiritual path.\n• If the reading is about your job, The Hermit may indicate withdrawing from the hectic pace of the workaday world, you seek solitude, wisdom, and inner peace. This card can also mean leaving a job or company and going your own way, independently.\n• In a reading about love, you may feel a need for some time alone to discover things about yourself and your path in life. The Hermit can also indicate a need for more independence or self-reliance in a relationship."},
  {name:"The Wheel of Fortune",suit:"Major Arcana",symbol:"✦",
   meaning:"A favorable outcome awaits you. Circumstances are changing for the better. Even if you aren't totally aware of what you've done to initiate the process, you've started the ball rolling, or rather, the wheel turning. Don't resist, these changes will promote growth and bring valuable learning experiences for you. It can be hard to stay balanced, but go with the flow and trust the process.\n• In a reading about money, this card heralds good fortune coming your way as a result of what you've already put into motion. Perhaps through a stroke of \"good luck\" your finances improve. Seize opportunities that present themselves.\n• If the reading is about your job, you may get a lucky break. Unexpected turns of events are likely, such as meeting people who can help you or receiving an offer \"out of the blue.\" Although this may appear fortuitous, it's all part of the grand plan for your life.\n• In a reading about love, a new romance may begin or an existing relationship may improve, even if you don't think you've done anything to make that happen. The time is right for this change. Enjoy it."},
  {name:"Strength",suit:"Major Arcana",symbol:"✦",
   meaning:"Strength shows you're exhibiting moral courage and fortitude. You've learned to work with your instinctive nature, to listen to it and hear its whisperings. In shamanic teachings and mythology, animals often serve as guides and teachers who help us on our way. This card indicates you've come through difficulties and learned to rely on inner strength to solve problems. You've grown strong through suffering trials and tribulations, you've tamed the \"beast\" within. The lesson of this card is we don't conquer our animal natures by brute force but by gentleness and feeling our way into rapport with the instinctive side.\n• In a reading about money, you have the inner resources necessary to succeed. Strength can mean you're in a strong position financially or that a venture is sound. Sometimes this card advises you to rely on yourself, not others, and to trust your instincts.\n• If the reading is about your job, Strength shows that challenges have led you to discover your inner strength. Use this strength to overcome obstacles, you can handle whatever comes your way. Because you've learned to listen to both logic and intuition, the decisions you make and the actions you take will succeed.\n• In a reading about love, this card can indicate you've befriended your instinctual side; now your inner drives are in harmony with your outer desires. It can also suggest being patient and gentle with a partner and/or yourself as you forge a strong relationship."},
  {name:"The Hanged Man",suit:"Major Arcana",symbol:"✦",
   meaning:"You feel suspended between the past and the future, a new direction is in the making. Although it can be difficult to let go of old patterns, people, and things that give you security, The Hanged Man says letting go is essential to your continued growth. Perhaps it's time to sacrifice superficial pleasures for a more spiritual way of life. You may have gone through a major transformation that's shaken up your old way of life and made you realize there's more to life than material goods, worldly success, and physical reality. The Hanged Man can also recommend looking at things from a different perspective, what do you see when you turn the picture upside down?\n• In a reading about money, this card may mean you've chosen to follow a less materialistic way of life. You may divest yourself of money and possessions, or simply change the way you think about money. Sometimes The Hanged Man indicates a loss that frees you to move forward in life without old attachments.\n• If the reading is about your job, you need to make a change, but the good news is there's no hurry. Take your time and make the right decisions about what you truly want, now and in the long term. Step outside the box and try to look at things in a new way.\n• In a reading about love, you (or your partner) may need to relinquish control and set aside your ego for the good of the relationship. Try to view the situation in a different way. The Hanged Man can indicate you are leaving a relationship that no longer holds meaning for you."},
  {name:"Death",suit:"Major Arcana",symbol:"✦",
   meaning:"The Death card signifies the end, or death, of a cycle. Whenever a stage in life ends, you need to mourn it. Trying desperately to hold on to what's clearly over causes trouble. Jobs end, relationships end, children grow up and move away from home. Change can't be avoided. The ultimate message of the Death card is the promise that new life follows disintegration. You're experiencing a metamorphosis: think caterpillar to butterfly.\n• In a reading about money, you may need to let go of old attitudes about money or change the way you've handled resources in the past. Death may also represent the end of one financial endeavor and the start of a new one.\n• If the reading is about your work, this card symbolizes a transition in your career path, a job change, or a major shift in your work arena. Old, outworn conditions that have held you back are breaking down to make room for new growth.\n• In a reading about love, Death says the patterns you once found workable are no longer effective. You and/or a partner may need to change the way you behave or interact with one another. Sometimes this card shows the end of an unsatisfactory relationship."},
  {name:"Temperance",suit:"Major Arcana",symbol:"✦",
   meaning:"Upright, Temperance indicates a time of inner growth and outer harmony. You're learning to temper your ego needs with the needs of the spirit within. With patience, you can blend disparate elements of yourself and/or your world into a harmonious whole.\n• In a reading about money, moderation is the key. Don't expect immediate gains or huge profits at this time. This card may indicate a period when your finances are balanced, or it may recommend getting money matters in order.\n• If the reading is about your job, Temperance represents a time of cooperation and relative peace in your workplace. It can also recommend distributing responsibilities and rewards among coworkers in an equitable way. Sometimes this card tells you to balance work and play.\n• In a reading about love, Temperance urges you to heal rifts, avoid ego struggles, and seek peace in a relationship. It can also advise you to let a relationship develop at its own pace, don't try to rush things."},
  {name:"The Devil",suit:"Major Arcana",symbol:"✦",
   meaning:"When The Devil shows up in a reading, he recommends re-evaluating your relationship to people and material things that keep you \"chained.\" It's time to let go of old fears, hang-ups, inhibitions, and ways you manipulate others to satisfy your needs. The Devil tells you to figure out what's true and what's false, at least for you.\n• In a reading about money, this card can advise you to confront fears about financial security, social status, and material success. Are you too attached to money and material things? Are you taking advantage of others for personal gain? Are you \"selling your soul to the devil\" in order to profit?\n• If the reading is about your work, The Devil may indicate you're chained to your job and neglecting other areas of life. Perhaps you're a workaholic or crave the status your position gives you. This card warns against engaging in questionable practices to get ahead.\n• In a reading about love, The Devil asks, \"Is an abusive, obsessive, or harmful relationship adversely affecting your life?\" Sexual desire may cause you to overlook character flaws in a partner. Self-inflicted bondage is preventing you from moving ahead."},
  {name:"The Tower",suit:"Major Arcana",symbol:"✦",
   meaning:"When this card appears, it usually means you've ignored or denied something that's rotten and needs to be blown apart. You're probably surprised, but you shouldn't be. You knew changes were necessary, but you refused to take action. Then something happens, losing a job, the end of a relationship, an accident, a financial setback, that forces you to face reality. Bigtime. Your life is collapsing around you, but that old, worn-out structure had to go. The Tower demands you free yourself from the self-created fortress in which you've imprisoned yourself. In the wake of the chaos, a new order can grow.\n• In a reading about money, this card heralds a major change in your finances. An unexpected loss or setback may cause you to reassess your attitudes about money, and perhaps free you from your attachment to wealth, status, possessions, and the related responsibilities.\n• If the reading is about your work, The Tower may represent a sudden job loss or change in your workplace. Yes, you're shocked and feel the rug's been pulled out from under you, but this may be exactly what you need to escape the walls that trapped you.\n• In a reading about love, this card suggests you need to overthrow false ideas, old habit patterns, and outdated ways of relating to a partner. A breakup or major change in a relationship is necessary and imminent; with it will come more freedom."},
  {name:"The Star",suit:"Major Arcana",symbol:"✦",
   meaning:"The Star signals an end to problems and the start of a new, happier phase of life. I think of it as the \"light at the end of the tunnel card.\" You've been preparing for this time and now you've arrived. The Star shows you're in harmony with your life purpose, using your gifts beneficially. It signifies inspiration, intuition, inner wisdom, and joy.\n• In a reading about money, The Star signals an improvement in your financial position. Help comes from both the invisible world and the material one. Remain hopeful, your dreams can be achieved.\n• If the reading is about your job, you may be moving into the spotlight, getting recognition for your efforts, you're the \"star\" and it's your turn to shine. You feel good about yourself and confident in your place in the universe. Success lies just around the corner.\n• In a reading about love, this card represents a bright, beautiful relationship that inspires you and brings you joy. The wish you made has or will soon come true."},
  {name:"The Moon",suit:"Major Arcana",symbol:"✦",
   meaning:"The Moon upright shows you tuning in to your lunar energies. You're becoming more aware of your feelings and inner life. The Moon also suggests psychic ability, you can sense other people's vibrations because you're connected to the information network of the invisible world. Pay attention to your dreams, feelings, instincts, and intuition. For artistic people, The Moon's appearance may indicate a time of increased imagination and creativity.\n• In a reading about money, this card recommends listening to your intuition as well as your intellect in connection with a money matter. However, don't make a decision based on emotion alone. The Moon can also point to ups and downs, changing phases, in a financial situation.\n• If the reading is about your job, The Moon can mean a situation has a hidden or \"dark\" side, this isn't necessarily bad, but you may not be aware of all the dynamics at work. Illusions or secrets may cause confusion. If you began something during the new moon, you may see things more clearly or a project may reach culmination during the full moon.\n• In a reading about love, this card symbolizes a highly emotional relationship that may be tinged with illusions. Sometimes it represents a sensitive partner who nurtures you, especially creatively, or that you're working on issues of mothering and nurturing."},
  {name:"The Sun",suit:"Major Arcana",symbol:"✦",
   meaning:"The Sun brightens any negative cards in a reading, no matter where it appears in the spread. Its influence is always beneficial. A new day is dawning and you're glad to be alive. Whatever your question, the answer is positive. For creative people, The Sun can indicate a time of increased inspiration and productivity. Whatever you undertake at this time is likely to prosper, for the sun is shining on you. This is a good time to start new projects and expand your horizons, it's your \"day in the sun.\"\n• In a reading about money, you may receive rewards for your work or talent. Investments and business ventures pay off. Opportunities abound. For creative people, this card suggests you'll benefit financially from your artistic endeavors.\n• If the reading is about your job, The Sun marks a period of prosperity, enthusiasm, honors, public recognition, and attainment. You feel confident in your abilities and attract opportunities to show the world what you can do. Step into the spotlight, it's your time to shine.\n• In a reading about love, The Sun represents a happy, pleasurable relationship in which you feel content and comfortable. You and your partner inspire each other and enjoy being together. If you're looking for love, this card can herald a bright and beautiful romance."},
  {name:"Judgement",suit:"Major Arcana",symbol:"✦",
   meaning:"Generally speaking, this is a positive card symbolizing regeneration and rebirth into wholeness after a period of confusion. I call this the \"wake-up card.\" You're gaining self-awareness, judging your actions, choices, and life situation, determining what you want to keep and what to toss on the scrap pile. This is a time of coming clean to yourself, assessing the good, the bad, and the ugly so you can chart your course from here on with greater clarity and maturity.\n• In a reading about money, you're facing a choice in a financial matter, the choice you make will impact not only the present but your future too. You may seek the advice of others, but only you can decide.\n• If the reading is about your job, Judgment shows you're assessing your career and making a choice. Perhaps you'll decide to take a different path than the one you've been following, one that more closely aligns with your talents and objectives.\n• In a reading about love, this card indicates you're facing a decision about a relationship. Judgment upright also suggests you're becoming more tolerant and less judgmental of yourself and other people."},
  {name:"The World",suit:"Major Arcana",symbol:"✦",
   meaning:"Harmony reigns and you are progressing in accord with your destiny. Success is assured when The World appears upright. Everything is available to you, honors, love, happiness, abundance. Whatever you undertake now will prosper, a financial endeavor, a career move, a relationship. This card symbolizes the end of an old cycle and the beginning of a new one.\n• In a reading about money, you reap the rewards you deserve. In this time of fulfillment and abundance, investments pay off, you receive what's due to you, and you realize that you have all you need.\n• If the reading is about your job, you succeed because you have learned what you needed to learn, have fulfilled your potential, and are now in harmony with the universe. Everything is progressing according to divine plan. Enjoy this time of accomplishment when opportunities abound and you're free to do what pleases you.\n• In a reading about love, this card represents a mature and fulfilling relationship. You've overcome your ego, fears, and insecurities; now you can enjoy a rich, happy, and harmonious partnership that's both physically and spiritually rewarding."},
  // ── Wands ─────────────────────────────────────────────────────────────
  {name:"Ace of Wands",suit:"Wands",symbol:"♦",
   meaning:"This Ace symbolizes a new beginning, one full of passion and rich with promise. You're ready to express yourself in a new, dynamic way. You want to be seen in a new light. You're bringing your creativity to bear in an exciting endeavor, and you're psyched about the possibilities opening up before you. I think of this as the \"go for it\" card.\n• In a reading about money, this Ace suggests profits coming from a creative venture. It can also mean you're investing your resources and energy in a new enterprise you feel passionate about.\n• In a reading about work, the card shows you expressing yourself passionately through a creative endeavor, perhaps even forging a new identity. You're totally focused on your objective, and your enthusiasm will help bring success.\n• In a reading about a relationship, the Ace promises new love of a highly romantic, joyful, and passionate kind. It can also mean loyalty, commitment, and a strong sense of purpose, perhaps of a creative nature, in an existing partnership."},
  {name:"II of Wands",suit:"Wands",symbol:"♦",
   meaning:"You're beginning to assert yourself, taking charge of an endeavor. Upright, the Two shows you waiting to see results in a venture. You feel confident of your success. You may accept advice or assistance from someone else, but you won't compromise your position or leadership.\n• In a reading about money, this card indicates you may benefit from other people's guidance, ideas, and encouragement but want to make it on your own, rather than depending on others.\n• In a reading about work, the Two shows you investing lots of energy in an endeavor. Take charge and don't let other people stand in your way, dissuade you, or diminish your enthusiasm.\n• In a reading about love, the Two upright suggests you're building a rewarding partnership. Sometimes it represents a creative relationship in which two people inspire and encourage each other."},
  {name:"III of Wands",suit:"Wands",symbol:"♦",
   meaning:"You've developed a project, business, creative endeavor, or other venture, and now you're ready to share it with others. By devoting yourself fully to your goal, you can succeed. Do what's necessary to bring your dreams to fruition.\n• In a reading about money, the upright Three shows increase and financial support coming to you. You may have to spend money to make money, but this card promises success.\n• In a reading about work, this card suggests an exciting time when your efforts start to bear fruit. You're giving it your all, inspiring others, and attracting people who are eager to help you. Your ideas begin to take form. Collaboration can be beneficial.\n• If you asked about a relationship, the Three indicates a commitment, an engagement or marriage. You and a partner express passionate feelings for each other and celebrate your love."},
  {name:"IV of Wands",suit:"Wands",symbol:"♦",
   meaning:"Everything is working out well when this card comes up in a reading. It indicates pleasure and prosperity, financial stability, and a happy home life. I call this the \"comfort card.\" You've shown the world who you are and what you can achieve, and you've gained the recognition and rewards you deserve.\n• In a reading about money, the Four upright suggests prosperity and financial security. You may reap benefits from investments or make money from the sale of property.\n• In a reading about work, this card shows success, harmony, and stability in your business or career. You derive satisfaction from a job well done. The Four also represents happiness and fulfillment in a creative venture and perhaps recognition on a broader scale.\n• In a reading about love, you find contentment, peace, and ease in a relationship. A happy and comfortable home life is yours."},
  {name:"V of Wands",suit:"Wands",symbol:"♦",
   meaning:"Bickering and self-interest cause irritation, and you need to concern yourself with getting matters back on track. Discontent may arise from differences in philosophy or personality. When this card shows up, you may be defending your territory, putting up a fight to hold on to what you think is \"yours.\" Try to assess the situation objectively, this may be a mock battle or a conflict of egos that lacks genuine substance.\n• In a reading about money, this card may show your financial situation is unstable or competition is cutting into your take. Arguments about money and spending cause tension.\n• In a reading about work, the Five can represent competition in the marketplace. In-house conflicts or stubbornness may also cause problems. Perhaps you're confused about your direction or you lack self-confidence.\n• In a reading about love, this card suggests you're letting your ego rule. You may stubbornly refuse to compromise or make necessary changes. The Five can also reveal differences of perspective that cause problems."},
  {name:"VI of Wands",suit:"Wands",symbol:"♦",
   meaning:"The Six of Wands promises a time of happiness and fulfillment. You've marshaled your energies during times of struggle and overcome obstacles. Now you're on top and can expect recognition and rewards. You feel good about yourself and your accomplishments. Sometimes this card shows recovery from an illness or setback.\n• In a reading about money, you can expect financial success. A long-term investment may pay off now or you may receive a raise/bonus.\n• In a reading about work, this card can mean getting a promotion, receiving respect for your efforts, or seeing a creative project come to fruition. Enjoy your well-deserved success.\n• In a reading about love, the upright Six indicates a time of happiness, love, and cooperation in a relationship. If you're seeking a partner, this card offers encouragement for true love."},
  {name:"VII of Wands",suit:"Wands",symbol:"♦",
   meaning:"When this card appears, you may need to fend off competitors or enemies to achieve your objective. Even if the challenges are formidable, you can overcome them. The Seven encourages you to stay strong and focus your will to win the struggle.\n• In a reading about money, this card tells you to hold firm in a financial matter even if things appear difficult at present. Avoid arguments about money or possessions.\n• In a reading about work, the upright Seven advises holding your ground. Try to keep your spirits up and don't show weakness. Keep working diligently for what you want, don't let other people distract you.\n• In a reading about love, this card recommends trying to work things out with a partner instead of squabbling. It may seem easier to just give up, but if you keep a positive attitude you can resolve difficulties."},
  {name:"VIII of Wands",suit:"Wands",symbol:"♦",
   meaning:"This card shows a busy period in your life, when you feel catapulted toward something you desire. Even though you may be a bit overwhelmed, you're excited and inspired, confident that all will turn out well. Take a few risks. Break out. Try new things and let go of what no longer suits you.\n• In a reading about money, you may experience rapid gains or sudden opportunities. Perhaps you feel a sense of urgency in financial areas and may need to make split-second decisions.\n• In a reading about work, the upright Eight suggests a time of inspiration, when things happen fast and you have to make quick decisions. Your career moves forward rapidly and you have to hustle to keep up. This card can also represent job-related travel.\n• In a reading about love, the upright Eight points to a passionate and exciting romance. It can indicate a sudden love affair that sweeps you off your feet or a hasty marriage."},
  {name:"IX of Wands",suit:"Wands",symbol:"♦",
   meaning:"Nines represent completion and fulfillment, and when the Nine of Wands appears upright in a reading, it indicates you've finished a job and done it well. As a result of oppositions you've faced and triumphed over, you've grown stronger. You've demonstrated self-discipline, skill, and wisdom, and come out on top.\n• In a reading about money, the upright Nine suggests you've suffered losses in the past but gotten matters in hand. Now you're in a more stable position.\n• In a reading about work, this card says the worst is over. Stay the course; stand your ground. You've recovered from setbacks and success lies ahead.\n• In a reading about love, the Nine shows you and a partner resolving difficulties. It promises happier times in your future. Perhaps you've both learned something important about yourselves and the relationship."},
  {name:"X of Wands",suit:"Wands",symbol:"♦",
   meaning:"The Ten of Wands suggests you've overextended yourself and you're weary from the effort. I think of this as the \"carrying the world on your shoulders card.\" You may need to set boundaries or find a different way of handling the responsibilities you're struggling with. Are you carrying burdens that really don't belong to you? Where can you turn for help? Are you unwilling to give up control and stop insisting on doing everything yourself?\n• In a reading about money, you may feel a pinch from taking on heavy obligations or supporting other people. Perhaps you've made unwise decisions and gotten into debt. Or, you may be staggering under the responsibilities of handling money, such as settling an estate.\n• In a reading about work, this card suggests you've undertaken too much and you're burning out. Maybe you're working overtime or assuming someone else's duties as well as your own.\n• In a reading about love, the Ten means taking a mature, responsible attitude toward a relationship. A card of commitment, it sometimes means supporting a partner through a difficult time."},
  {name:"Page of Wands",suit:"Wands",symbol:"♦",
   meaning:"The Page of Wands represents the early stages of a situation or undertaking. It shows an optimistic attitude, enthusiasm, and an eagerness to succeed. If the card represents a person in your life, it could be a younger relative or friend, an apprentice, student, or assistant. This is the \"student card.\" Sometimes it indicates a person with a childlike (or childish) nature, regardless of age.\n• In a reading about money, this Page shows a new investment has the potential to pay off. The card can also recommend taking a creative approach to making money.\n• In a reading about work, you're probably starting a new job you enjoy, learning a new skill, or preparing yourself for a career of a creative nature.\n• If you asked about love, this card indicates an innocent and playful approach to a relationship. It shows openness, honesty, and an optimistic attitude toward love."},
  {name:"Knight of Wands",suit:"Wands",symbol:"♦",
   meaning:"When the Knight of Wands appears upright, he brings good news. Sometimes he represents a trip or relocation. Some sort of movement or activity is afoot, of a happy kind. If the Knight represents a real person, he's a good-natured and likable chap, generous of spirit, idealistic, a loyal friend.\n• In a reading about money, he suggests a fortunate opportunity is on the horizon and/or a financial change is coming. You may receive money unexpectedly. Or, the card may advise you to take a financial risk.\n• In a reading about work, the Knight upright may represent a promotion or a transfer to another locale/company. He can also point to a business trip in the near future.\n• If you asked about love, this Knight indicates an enthusiastic and enjoyable affair, but don't expect it to last. Have fun, but realize your partner is a free spirit who doesn't like commitments."},
  {name:"Queen of Wands",suit:"Wands",symbol:"♦",
   meaning:"A fortunate card, the upright Queen gives you a \"thumbs up.\" If this card signifies a real person, she's a figure who commands respect, whether she's in the boardroom or the home. A wise adviser, she is also a loyal friend, a loving partner, a trustworthy authority. She has a nurturing, colorful, and generous nature; she's confident in her abilities and encourages others to do their best.\n• In a question about money, the Queen says, \"Do what you love; the money will follow.\" You may receive money from a creative venture or prosper through a partnership or other alliance.\n• If you asked about a job matter, the upright Queen shows a period of fulfillment, when a project bears fruit and you're happy with the outcome. This is also a good time to birth or expand a venture.\n• In a reading about a relationship, she shows a passionate romance between loyal, loving partners."},
  {name:"King of Wands",suit:"Wands",symbol:"♦",
   meaning:"The King upright is a fortunate card, regardless of the situation. If he represents a real person, it's someone you can trust and rely on to do the right thing. He's a loyal friend, a fair-minded employer, a wise adviser, a competent and honest leader. This intelligent man has high ideals. He's an active, energetic, independent individual with a passion for life and an adventurous nature.\n• In a reading about money, you can expect good things to come your way when the King appears. Sometimes the King means getting a raise, that a venture will pay off, or that you have financial support.\n• If the reading is about your job, success is assured. The King may indicate a promotion or recognition for your efforts. It can also show you moving into a position of authority. Now is a good time to take a chance, for victory is yours.\n• In a question about love, the King of Wands says the relationship is a strong one with plenty of affection and passion, perhaps between two lively, creative, outgoing people."},
  // ── Cups ──────────────────────────────────────────────────────────────
  {name:"Ace of Cups",suit:"Cups",symbol:"♥",
   meaning:"The upright Ace denotes a burst of joy, the kind that comes with falling in love. Often its appearance heralds a new romance, but it can also represent the start of a creative project about which you feel happy. When this beautiful card shows up, it indicates you're on an emotional high and enjoying life. Sometimes it indicates the birth of a child or idea.\n• In a reading about money, the Ace suggests the beginning of a creative endeavor that promises to be profitable. Nurture it carefully and the seeds will bear fruit.\n• If the reading is about your work, you may be starting a new job and feel enthusiastic about it. Perhaps this position will allow you to express your creativity or fulfill a dream, even though it might take some time.\n• In a reading about love, the Ace symbolizes the first stages of a romantic relationship. Nurture it, so your love will blossom. Sometimes it represents awakening to divine love."},
  {name:"II of Cups",suit:"Cups",symbol:"♥",
   meaning:"The upright Two indicates a period of harmony, when things go smoothly between you and another person. I think of this as the \"honeymoon card,\" when you have high hopes and experience a time of accord, optimism, inspiration, and goodwill.\n• In a reading about money, the upright Two suggests a financial partnership or merging your resources with someone else's for mutual gain. It can also mean financial support comes from a partner or backer.\n• If the reading is about your job, this card describes a partnership that benefits both people. You inspire one another and enjoy working together. It can also represent cooperation and creative collaboration in your workplace.\n• In a reading about love, the Two upright symbolizes a happy relationship that's developing smoothly. You understand each other's needs and bring out the best in one another. This card shows harmony, balance, and mutual respect between two parties."},
  {name:"III of Cups",suit:"Cups",symbol:"♥",
   meaning:"The upright Three says you're enjoying a good time with people you care about and admire. You could think of this as the \"cheers card.\" It can also indicate expressing love, inspiration, and creativity with a community of like-minded people. The common bond between you \"fills your cups\" and brings blessings to all.\n• In a reading about money, the Three says you can profit from a collective undertaking. It shows you reaping rewards from an investment made with other people.\n• If the reading is about your job, the upright Three assures good fortune from a group effort. You feel joyful and fulfilled with the results. It's time to celebrate your success.\n• In a reading about love, this card can represent a marriage. It shows you celebrating your love and extending affection beyond your primary partnership to include friends, community, and kindred spirits."},
  {name:"IV of Cups",suit:"Cups",symbol:"♥",
   meaning:"The upright Four of Cups symbolizes boredom and stagnation. You're not satisfied with your life at this time but lack the incentive to make changes. You've detached emotionally from people and situations. Sometimes this card indicates you've sacrificed happiness for security.\n• In a reading about money, this card can mean you're too attached to money and security, perhaps at the expense of love and joy. Perhaps you've prioritized money in the past and now seek meaning in other things.\n• If the reading is about your job, you probably feel stuck and bored with your job. You may long for more creativity and enjoyment but have opted for security instead.\n• In a reading about love, the Four shows you withdrawing affection and energy from a relationship. Perhaps routine has sapped your enthusiasm. This card also symbolizes a relationship based on security rather than passion."},
  {name:"V of Cups",suit:"Cups",symbol:"♥",
   meaning:"A setback has left you feeling helpless and hopeless, and you can't see a way out of your pain. Most likely, you've brought the loss or disappointment on yourself. The Five of Cups shows you're focusing on what you lack rather than what you have, or could have if you changed your attitude. I think of this as the \"self-pity card.\"\n• In a reading about money, this card says you've endured losses, but all isn't lost. Don't keep throwing good money after bad. The Five also encourages you not to give up hope. In some cases, it warns against a financial matter you're considering.\n• If the reading is about your work, you feel unvalued, unfulfilled, and unhappy in your current position. Find a job you'll enjoy more.\n• In a reading about love, the upright Five can signify the end of a relationship. You feel hurt, disappointed, perhaps resentful. This split may open new possibilities for you."},
  {name:"VI of Cups",suit:"Cups",symbol:"♥",
   meaning:"A card of emotional renewal, perhaps after a time of unhappiness, the Six of Cups represents a willingness to share joy with others. You eagerly give of yourself and receive the good things life offers. Through your actions, you express love and caring to people you know and to the things you value.\n• In a reading about money, this card suggests an upswing in your finances, perhaps after a loss or time of limitation. It can represent a joint venture in which you share expenses and profits with others. Sometimes it indicates a debt repaid.\n• If the reading is about your job, the Six upright shows renewed enthusiasm for your work. Perhaps a change offers you more creativity or an improved work environment. Developing new skills can benefit you now.\n• In a reading about love, this card shows you're overcoming problems in a relationship and renewing positive feelings for one another. Sometimes the Six of Cups can mean reconnecting with a past lover."},
  {name:"VII of Cups",suit:"Cups",symbol:"♥",
   meaning:"The upright Seven suggests many choices and paths are available to you now, but you may have trouble deciding among them. Nothing is certain. Let your intuition as well as your intellect guide you.\n• In a reading about money, financial issues are colored by idealism. You have lots of ideas for making money, some inspired, some pure fantasy. Be careful with money and investments now, you're probably not seeing things clearly.\n• If the reading is about your job, you seek a creative occupation and may be considering various options. However, you may not be realistic about your abilities or the possibilities open to you. Examine your choices carefully, especially if something seems too good to be true.\n• In a reading about love, you feel romantic and may enjoy a highly emotional relationship with a person who inspires you. If you're not in a relationship, the Seven suggests you're contemplating what you really want, maybe indulging your fantasies."},
  {name:"VIII of Cups",suit:"Cups",symbol:"♥",
   meaning:"You wish things had turned out differently, but you can't salvage a matter, and you realize you must abandon it. It's time to let go and get out of the situation that has failed despite your best efforts. Move ahead with determination, find a new direction and learn from your experience.\n• In a reading about money, an investment hasn't paid off or you've lost money through no fault of your own, except, perhaps, not seeing things accurately. Cut your losses and conserve your resources.\n• If the reading is about your job, the Eight of Cups may recommend pouring your heart and soul into an endeavor. Don't let distractions throw you off course. Sometimes this card advises leaving a job that no longer interests you.\n• In a reading about love, this card can mean ending a relationship that's lost its spark. Conversely, it may show you getting serious about a partnership, giving it your all. You're no longer interested in casual flings."},
  {name:"IX of Cups",suit:"Cups",symbol:"♥",
   meaning:"You've achieved a position of comfort, abundance, and happiness. Now you eagerly share your warmth, love, good cheer, and other goodies with people you care about. The universe is smiling on you.\n• In a reading about money, you can expect good fortune when this card appears. An investment pays off, you get a raise, maybe even win the lottery. Rather than hoarding your loot, however, you share some with others.\n• If the reading is about your job, the Nine of Cups suggests a promotion or landing the job of your dreams. You feel fulfilled, happy, and inspired in your work. Whatever you undertake brings success.\n• In a reading about love, you've learned to open your heart and enjoy a richly rewarding love life. This card may describe a joyful, emotionally fulfilling, committed relationship or an abundance of romantic partners."},
  {name:"X of Cups",suit:"Cups",symbol:"♥",
   meaning:"Like other tens, this card signifies a time of completion, when you reap the rewards of what you've sown. Life is good. Abundance, in the true sense of the word, is yours.\n• In a reading about money, you're in a position of financial security and comfort. Your efforts pay off. Sometimes this Ten represents family money, an inheritance, or marrying into wealth.\n• If the reading is about your job, the upright Ten heralds rewards, respect, and recognition. You're proud of what you've accomplished and content with your success. This card can also mean working in a successful family business.\n• In a reading about love, this card represents a loving, supportive, joyful relationship. It indicates a happy family life, where the people involved share love openly and feel secure in their situation."},
  {name:"Page of Cups",suit:"Cups",symbol:"♥",
   meaning:"When the Page of Cups appears, it can indicate self-esteem issues. Perhaps you look to others to define you or place too much trust in people. It also suggests a keen intuition and latent artistic ability. Sometimes this card shows you facing an emotional issue about which you feel uncertain or unprepared. It can also represent the early stages of a relationship.\n• In a reading about money, the Page indicates naivety in money matters. Perhaps you've got your head in the clouds or don't know how to manage your finances. Sometimes this card recommends seeking guidance from an expert, but it can also show you're too trusting of others.\n• If the reading is about your job, this card may represent the beginning of a new job or creative venture. Or, it can mean you're studying to improve your skills and marketability. Sometimes it urges you to stand up for yourself, instead of trusting others in your workplace.\n• In a reading about love, the upright Page may signify the first blush of a romance. It can also mean you feel shy, vulnerable, or uncertain about a relationship. Perhaps you tend to give too much of yourself and trust too much, you'd benefit from a more equitable situation."},
  {name:"Knight of Cups",suit:"Cups",symbol:"♥",
   meaning:"When this Knight appears upright, he can indicate changes and/or travel, perhaps a vacation with a lover. Usually the change is a pleasant one. It can also mean receiving an offer or invitation that sounds exciting, but it may not be practical or even doable. If the Knight of Cups represents a real person, he's someone who's fun but immature, unsure of his true feelings, and likely to bolt at the first sign of difficulty.\n• In a reading about money, the Knight can represent a bold venture but not a practical one. He may indicate carelessness with money and possessions. He can also show a change in your finances, which could be good or bad, or receiving word about a financial matter.\n• If the reading is about your job, the upright Knight suggests you'll have a chance to use your imagination and creativity. Sometimes it shows travel, a job change, or relocation for work. It can also advise you to get serious and commit yourself if you want to succeed.\n• In a reading about love, this card represents an exciting romance but not one that's likely to last long. Enjoy yourself, but try not to lose your head. The upright Knight may also signify a relationship with an artistic person."},
  {name:"Queen of Cups",suit:"Cups",symbol:"♥",
   meaning:"The upright Queen represents deep emotions, compassion, and caring. When she comes up, you're experiencing strong feelings about someone or something. She can also urge you to use your intuition or express your creativity. If this card signifies a real person, she's nurturing and generous, a mother figure. Ruled by her heart, not her head, she's changeable and sometimes unreliable.\n• In a reading about money, the Queen can mean earning money from a creative activity. Often she recommends being flexible and willing to make changes. Use your intuition as well as your intellect in financial matters.\n• If the reading is about your job, this can be a creative and inspired time for you. To be happy, you need to be able to use your imagination in your job. Sometimes the Queen shows an unrealistic attitude about work or a desire to be taken care of rather than working.\n• In a reading about love, the upright Queen represents a deeply romantic, sensual, and emotional relationship. You open yourself to a partner and lavish him or her with love. Sometimes the Queen advises you to be more discriminating. This is a fortunate card if you want to have children."},
  {name:"King of Cups",suit:"Cups",symbol:"♥",
   meaning:"When the King of Cups appears upright, he represents strong emotions and creative talent. If he represents a real person, it's someone who wants to be loved and admired, he may go to great lengths to gain your attention and affection. Although he's easily hurt, he may not show it and can hold a grudge. He can be rather indulgent and controlling, but his friends can count on his support and protection.\n• In a reading about money, the King can mean receiving money through a creative venture. Or, it may suggest your emotions are influencing a financial matter. Sometimes it represents a financial backer.\n• If the reading is about your job, the King can describe a creative occupation. However, he may indicate you're longing for something better. Perhaps you've grown complacent.\n• In a question about love, this card represents a deeply emotional, committed, and romantic relationship. It can suggest jealousy and possessiveness, however, or a need for more trust and openness."},
  // ── Swords ────────────────────────────────────────────────────────────
  {name:"Ace of Swords",suit:"Swords",symbol:"♠",
   meaning:"This Ace indicates success through the use of mental means or spiritual growth. You're using your intellect in a clear, focused way, devoting yourself to a goal. An opportunity is being offered to you, grab it. Sometimes this card points to a breakthrough or inspiration.\n• In a reading about money, the upright Ace represents the birth of an idea or start of an intellectual project that could bring profits. It can also mean negotiating a contract or discussing a financial issue.\n• If the reading is about your work, this card suggests starting a job that involves communication. You have an opportunity to use your intellect productively or to express your philosophical/spiritual views in your work. Clarity and focus will help you get ahead. This Ace can also indicate starting a course of study that will further your career.\n• In a reading about love, the Ace upright symbolizes a relationship in which you share ideas, inspire one another, and enjoy lively conversation. It can also mean a relationship with a mentally oriented person or one who can teach you much."},
  {name:"II of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright Two can symbolize balancing the right and left hemispheres of your brain, combining intuition with intellect. Drawing this card may mean you must make a decision and need to call on both. This Two can also advise you to take off your blindfold and look at a situation honestly.\n• In a reading about money, the upright Two recommends trusting your own wisdom and inner guidance in a financial matter. Pay attention to your intuition as well as logic.\n• If the reading is about your job, you may be confused or conflicted about a work-related issue. Have faith in your own judgment and ideas. Sometimes the upright Two represents a job that requires both intellect and imagination.\n• In a reading about love, this card suggests listening to both your head and your heart. It can mean you and your partner hold conflicting perspectives or that you're trying to resolve differences and find harmony."},
  {name:"III of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright Three signifies separation, severing a connection to something or someone you love. You feel isolated and cut off from something you found meaningful, a way of life, your home and family, a philosophy, pursuit, or job. Something in your life has died, usually because it has lost its meaning or run its course, and you need to let it go.\n• In a reading about money, the upright Three represents losses due to relying on your rational mind or your emotions alone, you need to use both to avoid problems. Sometimes it suggests someone you trusted has withdrawn support or you're grieving the loss of better times.\n• If the reading is about your work, this card can mean losing a job you loved. Or, you feel isolated and unhappy in your job. Maybe you regret an unwise business decision or you're thwarted, unable to do the work you enjoy. Try to see this as a sign: it's time for a change.\n• In a reading about love, the upright Three can represent a split with a partner, or at least a sense of separation and despair. If the relationship is worth salvaging, heal the gap with compassion and understanding. In some cases, this card says it's time to move on."},
  {name:"IV of Swords",suit:"Swords",symbol:"♠",
   meaning:"Often this card means you've been through a period of difficulty and now feel the need for introspection and solitude. You're examining what you've experienced, trying to understand what it all means, so you can plan for your future. This is the \"calm after the storm card.\" Sometimes it shows you're starting to recover after a physical illness or injury.\n• In a reading about money, the upright Four urges caution and discrimination. Maybe you need to separate yourself from a financial issue. This card can also suggest you feel overwhelmed by financial burdens and need a rest.\n• If the reading is about your job, you probably feel burned out at work and need a vacation. After a period of stress, confusion, or difficulty, you may be sorting things out, clearing your head, and regaining your strength.\n• In a reading about love, the Four upright can mean carving out some time for yourself. Challenges in a relationship may have left you feeling drained or discouraged. Look within to discover your true needs and how you can restore balance."},
  {name:"V of Swords",suit:"Swords",symbol:"♠",
   meaning:"The Five of Swords symbolizes the devastation of war and recommends using diplomacy to resolve problems. After a \"battle,\" you realize fighting isn't the best way to settle disputes. The cost of winning may not be worth the losses you've endured.\n• In a reading about money, this card represents disputes over money, perhaps in a legal matter. It also warns that even if you \"win\" you may suffer. Try to resolve differences without \"drawing swords.\" Vacillation or lack of clarity can cause setbacks too.\n• If the reading is about your job, the upright Five cautions you to avoid arguments, don't make enemies. This card may also indicate you're confused about how to proceed or suggest you need to get more info before taking the next step.\n• In a reading about love, this card says you won't get what you want by arguing. Hurtful words can't be taken back. Try to resolve problems amicably, honestly, and fairly. You may have to make some changes in order to improve a situation."},
  {name:"VI of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright Six suggests \"smooth sailing\" ahead, as you leave behind the trauma and sadness of the past. You're embarking on a new path, and the changes you make now are based in the wisdom you've gained through suffering. Sometimes this card symbolizes a journey, either of a physical or spiritual nature, perhaps a \"vision quest.\"\n• In a reading about money, you've learned much as a result of past difficulties and now have more clarity that can help you benefit financially. Sometimes this card recommends letting go of an investment or possession. It can also represent relocation or travel for financial reasons.\n• If the reading is about your job, this card shows your work situation improving. Perhaps you've resolved past problems or you've chosen to move to a different position that suits you better. Sometimes the upright Six symbolizes a business trip.\n• In a reading about love, the upright Six indicates you and a partner have resolved major problems and arrived at a place of harmony and understanding. Let bygones be bygones. In some cases, this card means leaving an unworkable relationship for something better."},
  {name:"VII of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright Seven suggests a tricky situation in which things are not completely clear. You may be formulating a plan but don't have all the information you need. Or, the plan may be risky and could backfire. This card can represent surreptitious action and advises diplomacy.\n• In a reading about money, the Seven warns that you probably shouldn't go ahead with a financial idea or investment you're considering. Perhaps the risks are too high. Or, the deal may be shaky or shady.\n• If the reading is about your job, this card says don't engage in direct confrontation. Work behind the scenes to get results. The upright Seven can also indicate restlessness; perhaps your job lacks the diversity or stimulation you desire. Consider making a change.\n• In a reading about love, you're advised to seek compromise and use diplomacy, rather than arguing with a partner, but don't just go along to get along. Sometimes this card shows leaving a relationship that doesn't meet your intellectual or spiritual needs."},
  {name:"VIII of Swords",suit:"Swords",symbol:"♠",
   meaning:"A card of self-undoing, this is the \"you are your own worst enemy card.\" You know you need to do something, but you're unwilling to act. Perhaps you're in denial about a situation. Consequently, you're stuck in a painful state. However, the Eight upright says you have the resources necessary to \"get out of jail\" if only you can overcome your fear.\n• In a reading about money, you may feel your hands are tied, but that's an illusion. Still, you must make choices to free yourself from a limiting situation. Perhaps you've fallen into debt through unwise spending. Sometimes this card says be content with small gains.\n• If the reading is about your job, fear of change or feelings of inadequacy may be holding you back. As a result, you're blind to possibilities. Perhaps you're wasting energy or underusing your abilities. Upgrading your skills may help you advance.\n• In a reading about love, this card suggests you feel trapped or unfulfilled in a relationship. However, you're contributing to the problem. Perhaps your expectations aren't realistic, or you need to change your attitude if you want to change the situation."},
  {name:"IX of Swords",suit:"Swords",symbol:"♠",
   meaning:"You're agonizing about a problem, torturing yourself with worries and fears. This is the \"dark night of the soul card,\" for it shows you reaching deep within yourself to deal with a crisis. However, you probably feel hopeless and helpless to handle the situation on your own. This card may refer to deep-rooted or repressed issues coming to the surface, perhaps in the form of nightmares, so you can resolve them.\n• In a reading about money, this card represents anxiety, guilt, or desperation regarding a financial matter. Perhaps you're anguishing about a loss and kicking yourself for not having seen it coming. Sometimes the Nine advises downsizing. It can also mean money comes to you but at a high cost, such as an inheritance or insurance settlement.\n• If the reading is about your job, you feel drained, unhappy, or fearful in your position. You may be faced with a crisis you can't handle, or you're miserable in a job you don't think you can leave. Resisting only makes things harder. Sometimes this card signifies losing a job you love.\n• In a reading about love, the upright Nine indicates suffering due to a hurt caused by someone you care about. You may feel rejected, unloved, lonely, or unvalued. This card can represent the end of a relationship or a desperate need to correct a problem in a relationship."},
  {name:"X of Swords",suit:"Swords",symbol:"♠",
   meaning:"Your trials and tribulations are ending, but you still need to clear away the deadwood before you can move ahead. Extreme stress and worrying have exhausted you, perhaps leading to an illness, but the storm has passed and the clouds will open up again. Make a clean break from the past to alleviate pain and suffering.\n• In a reading about money, you may need to cut your losses, let go of possessions, and/or separate yourself from a past financial matter. Tie up loose ends, then move forward with the newfound insights you've gained from a painful situation.\n• If the reading is about your job, this card suggests you're burned out mentally and perhaps physically. You've been under so much pressure you don't think you can go on. Fortunately, you've turned a corner and the road ahead looks brighter. Sometimes this Ten can represent backstabbing, so be on guard.\n• In a reading about love, the upright Ten represents exhaustion after a period of hardship in a relationship. Sometimes it signifies betrayal. Or, it may represent the strain of caring for a loved one through an illness. Even if a relationship ends, you may look forward to starting over and being free from the troubles of the past."},
  {name:"Page of Swords",suit:"Swords",symbol:"♠",
   meaning:"When the Page appears upright, it may show you're thinking of branching out, testing yourself, embracing a challenge. Perhaps you're entering college, beginning a career, or starting off on a spiritual quest. Naturally you're anxious because you don't feel prepared. You may not have used your \"sword\" on the battlefield, but you've trained and developed the skills you need to succeed. Trust yourself.\n• In a reading about money, the Page can represent a message about a money matter. This card recommends examining details and informing yourself, rather than simply relying on others for advice. However, it also warns against overconfidence, ignorance can lead to losses.\n• If the reading is about your job, this card shows you beginning a career that tests your intelligence and education. You may be starting a project that requires good communication skills. Or, you may be refining your mental abilities and clarifying ideas.\n• In a reading about love, this card can indicate an immature or detached attitude toward relationships. Perhaps you're harboring an unrealistic ideal about love. The Page may also suggest you're not ready to commit to a relationship, you have other things to do first."},
  {name:"Knight of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright Knight may suggest you're passionate about your ideas and believe wholeheartedly in the rightness of your objective. If this card represents an actual person, he's probably a young man who expresses his ideas enthusiastically and may have trouble understanding other viewpoints. He has a quick mind and keen intellect but may lack true wisdom. Sometimes this Knight symbolizes an urgent message or an unexpected trip.\n• In a reading about money, you may need to act quickly in a financial matter, but don't neglect to study the situation before making a decision. The upright Knight may point to a trip for financial reasons or a message about money. Sometimes he heralds a change in your resources.\n• If the reading is about your job, this card can represent a business trip. Sometimes it means a job change or a shift in work-related responsibilities. The Knight may also caution you to hold your tongue and bide your time, diplomacy is important now.\n• In a reading about love, the Knight may point to a new affair or a change in an existing relationship that brings more freedom, excitement, and openness. It can also recommend being more flexible and tolerant."},
  {name:"Queen of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright Queen of Swords represents authority, wisdom, and power. In a reading, she suggests you've gone through emotional trials and grown as a result. Your will is strong, and you possess the intellectual resources to take charge of situations, at home and/or in the business world. If she signifies an actual person, she may be a single woman, divorcée, or widow who's transformed pain into wisdom.\n• In a reading about money, the upright Queen recommends using social networks and joining forces with other like-minded people to profit. Don't let your emotions influence financial decisions. Honesty is essential now, but don't reveal more than is necessary.\n• If the reading is about your job, this card can indicate a career in a communication field. Your intelligence and objectivity can help you advance. Sometimes this Queen suggests you need to speak up for yourself, ask for what you want, and stand your ground.\n• In a reading about love, you seek independence and equality in a relationship. Sometimes this card means choosing to remain single and/or childless in order to pursue intellectual or career goals. Shared ideas, ideals, and interests are more important to you in a partnership than passion."},
  {name:"King of Swords",suit:"Swords",symbol:"♠",
   meaning:"The upright King represents intellectual pursuits, communication, spiritual knowledge, and study. You may be mastering a mental task or using your communication skills successfully. Sometimes this card indicates a decision, judgment, or legal matter. If the King signifies an actual person, he may seem stern, analytical, or aloof, perhaps he's a lawyer or judge, a professor, military leader, scientist, or religious leader.\n• In a reading about money, the King upright recommends taking charge of a financial matter. Do your homework, don't let your emotions influence a decision involving money or investments. This card may also mean profiting from an intellectual endeavor.\n• If the reading is about your job, it may indicate you work in a field that requires keen intelligence, good communication, or analytical ability. The King advises you to show leadership regarding decisions or judgments, clarity and objectivity are important.\n• In a reading about love, the King symbolizes a relationship based on shared interests and ideas rather than passion. You and/or your partner resist expressing deep emotions, preferring a friendly partnership. Perhaps you fear losing independence if you open your heart."},
  // ── Pentacles ─────────────────────────────────────────────────────────
  {name:"Ace of Pentacles",suit:"Pentacles",symbol:"♣",
   meaning:"This card symbolizes the start of a new business, financial venture, or other practical endeavor. It represents \"sowing seeds,\" putting forth the initial effort, monetary, physical, and otherwise, needed to achieve the success you desire. Opportunities come your way now. Be pragmatic, realistic, and willing to work hard to bring your dream to fruition.\n• In a reading about money, the Ace represents a new investment or financial endeavor. Perhaps you'll soon receive info about a moneymaking opportunity. Plant seeds carefully and, with effort, they'll bear fruit.\n• If the reading is about your work, this card suggests you may be starting a new job that will profit you. You may be required to work hard to bring a project, business, or career to fruition, but this card says success is likely.\n• In a reading about love, the upright Ace says you may meet a partner through work-related avenues. It can also suggest launching a business/financial endeavor with a partner. Sometimes this card recommends taking a practical approach to a relationship."},
  {name:"II of Pentacles",suit:"Pentacles",symbol:"♣",
