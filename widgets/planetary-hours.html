<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetary Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fce8e6; --bg2:#f5d0cc;
    --text:#3d1515; --muted:#8b4545;
    --rose:#cc5353; --crimson:#a82222; --maroon:#a62524;
    --accent:#c0392b; --notion:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{background:transparent;}
  body{margin:0;font-family:'EB Garamond',serif;color:var(--text);padding:16px;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;background:var(--bg);border:1px solid rgba(160,37,36,.3);border-radius:14px;padding:20px;}
  h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.3rem;text-align:center;letter-spacing:.06em;color:var(--text);margin:0 0 4px;text-transform:uppercase;}
  .sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:18px;font-style:italic;}
  .card{background:var(--bg2);border:1px solid rgba(160,37,36,.25);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(160,37,36,.08);}
  .current{text-align:center;}
  .planet-symbol{font-size:2.6rem;display:block;margin-bottom:4px;color:var(--accent);text-shadow:0 0 20px rgba(192,57,43,.15);}
  .planet-name{font-family:'Cinzel Decorative',serif;font-size:1.3rem;color:var(--text);letter-spacing:.04em;}
  .planet-meta{color:var(--muted);font-size:.85rem;margin-top:4px;}
  .times{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:10px;border-top:1px solid rgba(160,37,36,.2);padding-top:10px;}
  .loc-btn{width:100%;background:var(--accent);color:#fff;border:1px solid var(--crimson);padding:10px 14px;border-radius:6px;cursor:pointer;font-family:'EB Garamond',serif;font-size:.95rem;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px;}
  .loc-btn:hover{background:var(--crimson);}
  .loc-btn svg{width:14px;height:14px;flex-shrink:0;}
  .status{font-size:.75rem;color:var(--muted);margin-top:8px;min-height:1em;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  td,th{padding:5px 4px;text-align:left;border-bottom:1px solid rgba(160,37,36,.12);}
  tr.active{background:rgba(192,57,43,.12);border-radius:6px;}
  th{color:var(--muted);font-weight:normal;text-transform:uppercase;font-size:.7rem;}
  .day-night-label{color:var(--accent);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px;}
  .planet-powers{margin-top:12px;border-top:1px solid rgba(160,37,36,.2);padding-top:10px;font-size:.85rem;line-height:1.55;color:var(--text);text-align:left;font-style:italic;display:none;}
  .planet-powers.show{display:block;}
  .planet-link{display:inline-flex;align-items:center;gap:5px;margin-top:12px;color:var(--accent);font-size:.8rem;text-decoration:none;letter-spacing:.04em;border:1px solid rgba(192,57,43,.3);padding:5px 12px;border-radius:6px;}
  .planet-link:hover{background:rgba(192,57,43,.1);border-color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Planetary Hours</h1>
  <div class="sub">Chaldean order · true local sunrise &amp; sunset</div>

  <div class="card" id="locForm">
    <button class="loc-btn" id="locBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" stroke-dasharray="4 2"/></svg>
      Detect My Location
    </button>
  </div>
  <div class="status" id="status">Detecting your location…</div>

  <div class="card current" id="currentCard" style="display:none">
    <span class="planet-symbol" id="curSymbol"></span>
    <div class="planet-name" id="curName"></div>
    <div class="planet-meta" id="curMeta"></div>
    <div class="times">
      <span id="curStart"></span>
      <span>&rarr;</span>
      <span id="curEnd"></span>
    </div>
    <div class="planet-powers" id="curPowers"></div>
    <a class="planet-link" id="curLink" href="#" target="_blank" rel="noopener noreferrer">Open Grimoire Page</a>
  </div>

  <div class="card" id="tableCard" style="display:none">
    <div class="day-night-label">Day Hours</div>
    <table><tbody id="dayHours"></tbody></table>
    <div class="day-night-label">Night Hours</div>
    <table><tbody id="nightHours"></tbody></table>
  </div>
</div>

<script>
const PLANETS = {
  Saturn:  {symbol:'♄', url:'https://app.notion.com/p/1f516dcf716481daa4e1d870b84cadad', powers:'Saturn governs death, binding, time, the underworld, underground forces, darkness, decrease, the elderly, sleep, solitude, entropy, endings, and discipline. Many fear working with Saturn, and it is indeed heavy to work with, but its influence bears upon us regardless.'},
  Jupiter: {symbol:'♃', url:'https://app.notion.com/p/1f516dcf716481c1b361f64f8207961e', powers:'Jupiter governs grace, accretion, wealth, abundance, success, health, honors, and materialism. More than anything else, Jupiter is about sovereignty, leading a life where you are the sovereign of yourself and your domain.'},
  Mars:    {symbol:'♂', url:'https://app.notion.com/p/1f516dcf716481a6bec0f56b08a4bd22', powers:'Mars governs war, conflict, defense, aggression, strength, competition, lust, courage, and confidence. Beyond raw martial force, Mars also possesses the power to establish calm, the warrior\'s calm that soldiers and police must maintain in tense situations.'},
  Sun:     {symbol:'☉', url:'https://app.notion.com/p/1f516dcf7164813cace8c0415df08d98', powers:'The Sun governs ego, inspiration, true will, great gains, health, peace, youth, resurrection, and promotions. Its radiant energy fuels vitality, creative power, and the manifestation of one\'s highest purpose.'},
  Venus:   {symbol:'♀', url:'https://app.notion.com/p/1f516dcf71648162b86bdab31c331af2', powers:'Venus rules emotions, love, friendships, romance, enchantment, beauty, art, parties, and all types of attraction and influence. Her domain encompasses the magnetic forces that draw people together and the aesthetic pleasures that make life beautiful.'},
  Mercury: {symbol:'☿', url:'https://app.notion.com/p/1f516dcf716481259c74da97a6cd02bc', powers:'Mercury governs thought, intellect, business, marketing, movement, intelligence gathering, science, theft, writing, games, and eloquence. Its energy is swift, multidimensional, and facilitates communication, learning, and the rapid exchange of information.'},
  Moon:    {symbol:'☽', url:'https://app.notion.com/p/1f516dcf716481d9bd79fa8586a47673', powers:'The Moon acts as a gateway to higher spiritual planes and deeper psychic awareness. It governs intuition, clairvoyance, scrying, and astral travel. Its energy influences dreams, femininity, sexual attraction, water, blood, and the management of time through cycles.'}
};
const CHALDEAN = ['Saturn','Jupiter','Mars','Sun','Venus','Mercury','Moon'];
const DAY_RULER = ['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn']; // index = Date.getDay()

// Solar position based sunrise/sunset (NOAA "general equation", ~1 minute accuracy)
function toJulian(date){ return date.getTime() / 86400000 + 2440587.5; }
function fromJulian(j){ return new Date((j - 2440587.5) * 86400000); }
const rad = Math.PI/180, deg = 180/Math.PI;

function sunTimesUTC(date, lat, lon){
  const J = toJulian(date);
  const n = Math.round(J - 2451545.0 + 0.0008);
  const Jstar = n - lon/360;
  const M = (357.5291 + 0.98560028 * Jstar) % 360;
  const Mrad = M*rad;
  const C = 1.9148*Math.sin(Mrad) + 0.0200*Math.sin(2*Mrad) + 0.0003*Math.sin(3*Mrad);
  const lambda = (M + C + 180 + 102.9372) % 360;
  const lambdaRad = lambda*rad;
  const Jtransit = 2451545.0 + Jstar + 0.0053*Math.sin(Mrad) - 0.0069*Math.sin(2*lambdaRad);
  const delta = Math.asin(Math.sin(lambdaRad) * Math.sin(23.4397*rad));
  const latRad = lat*rad;
  const cosH = (Math.sin(-0.83*rad) - Math.sin(latRad)*Math.sin(delta)) / (Math.cos(latRad)*Math.cos(delta));
  if (cosH > 1) return null; // sun never rises
  if (cosH < -1) return null; // sun never sets
  const H = Math.acos(cosH) * deg;
  const Jrise = Jtransit - H/360;
  const Jset = Jtransit + H/360;
  return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset) };
}

function buildHours(lat, lon, now){
  const today = new Date(now); today.setUTCHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setUTCDate(yesterday.getUTCDate()-1);
  const tomorrow = new Date(today); tomorrow.setUTCDate(tomorrow.getUTCDate()+1);

  const tY = sunTimesUTC(yesterday, lat, lon);
  const t0 = sunTimesUTC(today, lat, lon);
  const t1 = sunTimesUTC(tomorrow, lat, lon);
  if (!t0 || !t1 || !tY) return null;

  // Determine the relevant "day window": if now is before today's sunrise, we're in last night's
  // hours (yesterday sunset -> today sunrise). Otherwise today sunrise->sunset (day), then
  // today sunset -> tomorrow sunrise (night).
  let dayStart, dayEnd, nightStart, nightEnd, rulerDate;
  if (now < t0.sunrise) {
    dayStart = sunTimesUTC(yesterday, lat, lon).sunrise; dayEnd = tY.sunset;
    nightStart = tY.sunset; nightEnd = t0.sunrise;
    rulerDate = yesterday;
  } else {
    dayStart = t0.sunrise; dayEnd = t0.sunset;
    nightStart = t0.sunset; nightEnd = t1.sunrise;
    rulerDate = today;
  }

  const ruler = DAY_RULER[rulerDate.getUTCDay()];
  const startIdx = CHALDEAN.indexOf(ruler);

  const dayMs = (dayEnd - dayStart) / 12;
  const nightMs = (nightEnd - nightStart) / 12;

  const hours = [];
  for (let i=0;i<12;i++){
    hours.push({
      planet: CHALDEAN[(startIdx+i)%7],
      start: new Date(dayStart.getTime() + i*dayMs),
      end: new Date(dayStart.getTime() + (i+1)*dayMs),
      label: 'Day ' + (i+1)
    });
  }
  for (let i=0;i<12;i++){
    hours.push({
      planet: CHALDEAN[(startIdx+12+i)%7],
      start: new Date(nightStart.getTime() + i*nightMs),
      end: new Date(nightStart.getTime() + (i+1)*nightMs),
      label: 'Night ' + (i+1)
    });
  }
  return hours;
}

function fmt(d){
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function render(lat, lon, label){
  const now = new Date();
  const hours = buildHours(lat, lon, now);
  const status = document.getElementById('status');
  if (!hours){
    status.textContent = 'Could not compute sunrise/sunset for this location.';
    return;
  }
  status.textContent = `${label} — updated ${fmt(now)}`;

  const current = hours.find(h => now >= h.start && now < h.end) || hours[hours.length-1];
  document.getElementById('currentCard').style.display = 'block';
  document.getElementById('tableCard').style.display = 'block';
  document.getElementById('curSymbol').textContent = PLANETS[current.planet].symbol;
  document.getElementById('curName').textContent = current.planet;
  document.getElementById('curMeta').textContent = current.label.includes('Day') ? 'Daytime hour' : 'Nighttime hour';
  const powersEl = document.getElementById('curPowers');
  powersEl.textContent = PLANETS[current.planet].powers;
  powersEl.classList.add('show');
  document.getElementById('curStart').textContent = fmt(current.start);
  document.getElementById('curEnd').textContent = fmt(current.end);
  document.getElementById('curLink').href = PLANETS[current.planet].url;

  const dayBody = document.getElementById('dayHours');
  const nightBody = document.getElementById('nightHours');
  dayBody.innerHTML = ''; nightBody.innerHTML = '';
  hours.forEach(h => {
    const tr = document.createElement('tr');
    if (h === current) tr.className = 'active';
    tr.innerHTML = `<td>${PLANETS[h.planet].symbol} ${h.planet}</td><td>${fmt(h.start)}</td><td>${fmt(h.end)}</td>`;
    (h.label.startsWith('Day') ? dayBody : nightBody).appendChild(tr);
  });
}

let currentLat = null, currentLon = null, currentLabel = '';

function setCoords(lat, lon, label){
  currentLat = lat; currentLon = lon; currentLabel = label;
  render(lat, lon, label);
}

function geoDetect(){
  const status = document.getElementById('status');
  status.textContent = 'Detecting your location…';
  if (!navigator.geolocation){
    status.textContent = 'Geolocation is not supported by this browser.';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const label = `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
      setCoords(lat, lon, label);
    },
    err => {
      status.textContent = 'Location access denied. Please allow location in your browser and try again.';
    },
    { timeout: 10000 }
  );
}

document.getElementById('locBtn').addEventListener('click', geoDetect);

// Auto-detect on load
geoDetect();

// refresh every minute
setInterval(() => {
  if (currentLat !== null) render(currentLat, currentLon, currentLabel);
}, 60000);
</script>
</body>
</html>
