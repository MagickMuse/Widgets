<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Numerology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fce8e6; --bg2:#f5d0cc;
    --text:#3d1515; --muted:#8b4545;
    --accent:#c0392b; --crimson:#a82222;
  }
  *{box-sizing:border-box;}
  html,body{background:transparent;}
  body{margin:0;font-family:'EB Garamond',serif;color:var(--text);padding:16px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;}
  .wrap{max-width:440px;width:100%;text-align:center;background:var(--bg);border:1px solid rgba(160,37,36,.3);border-radius:14px;padding:24px 20px 20px;}
  h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.8rem;font-style:italic;margin-bottom:22px;}

  .number-big{
    font-family:'Cinzel Decorative',serif;
    font-size:4.5rem;
    line-height:1;
    color:var(--accent);
    letter-spacing:-.02em;
    margin-bottom:4px;
  }
  .number-label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:20px;}

  .number-card{background:var(--bg2);border:1px solid rgba(160,37,36,.25);border-radius:12px;padding:20px 18px 16px;margin-bottom:14px;}
  .number-name{font-family:'Cinzel Decorative',serif;font-size:1.25rem;letter-spacing:.04em;color:var(--text);margin-bottom:4px;}
  .number-meta{color:var(--accent);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;}
  .number-desc{font-size:.95rem;line-height:1.6;color:var(--text);font-style:italic;text-align:left;}

  .divider{height:1px;background:rgba(160,37,36,.2);margin:14px 0;}

  .section-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:6px;text-align:left;}
  .divination-text{font-size:.9rem;line-height:1.55;color:var(--text);text-align:left;}

  .calc-box{background:rgba(160,37,36,.07);border:1px solid rgba(160,37,36,.15);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;color:var(--muted);line-height:1.8;text-align:center;}
  .calc-box .eq{color:var(--accent);font-weight:bold;}

  .grimoire-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
    background:transparent;border:1px solid rgba(160,37,36,.4);color:var(--muted);
    padding:9px 14px;border-radius:6px;cursor:pointer;
    font-family:'EB Garamond',serif;font-size:.85rem;letter-spacing:.03em;
    text-decoration:none;transition:background .15s,color .15s,border-color .15s;
  }
  .grimoire-btn:hover{background:rgba(192,57,43,.1);color:var(--text);border-color:var(--accent);}
  .grimoire-btn svg{width:13px;height:13px;opacity:.7;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Daily Numerology</h1>
  <div class="sub" id="dateSub"></div>

  <div class="number-big" id="numberBig"></div>
  <div class="number-label" id="numberLabel"></div>

  <div class="calc-box" id="calcBox"></div>

  <div class="number-card">
    <div class="number-name" id="numberName"></div>
    <div class="number-meta" id="numberMeta"></div>
    <div class="number-desc" id="numberDesc"></div>
    <div class="divider"></div>
    <div class="section-label">Divination</div>
    <div class="divination-text" id="divinationText"></div>
  </div>

  <a class="grimoire-btn" id="grimoireBtn" href="#" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    Open in Symbol Grimoire
  </a>
</div>

<script>
const NUMBERS = {
  1:{name:"One",planet:"Sun",element:"Fire",
    numerology:"Within numerology, one carries the oneness of all things and the individual. In the Yantra system of Hindu numerology, one marks the seed, the opening stage in the turning of the seasons and humanity's progress across the Earth.",
    divination:"Fixed in purpose, single-minded, powerful, obstinate, ambitious, independent, self-sufficient, assertive, self-reliant, inventive, creative.",
    url:"https://app.notion.com/p/1f516dcf716481638b06c987389e19da"},
  2:{name:"Two",planet:"Moon",element:"Water",
    numerology:"Within numerology, two carries duality, balance, and separation. In the Yantra system of Hindu numerology, two marks germination.",
    divination:"Tactful, conciliatory, even-tempered, diplomatic, persuasive, non-assertive, changeable, deceitful, cruel, malicious.",
    url:"https://app.notion.com/p/1f516dcf716481378695ea853c764916"},
  3:{name:"Three",planet:"Jupiter",element:"Fire",
    numerology:"Within numerology, three carries spirit, communication, and wisdom. In the Yantra system of Hindu numerology, three marks sprouting.",
    divination:"Imaginative, energetic, bright, expressive, versatile, witty, successful, charming, ambitious, proud, lucky, commanding, seeks approval, over-extended, energies diffused.",
    url:"https://app.notion.com/p/1f516dcf71648159846afff38d40673f"},
  4:{name:"Four",planet:"Uranus",element:"Air",
    numerology:"Within numerology, four carries the Earth, solidity, understanding, and order. In the Yantra system of Hindu numerology, four marks the stage of testing and trials.",
    divination:"Solid, practical, organized, administrative, calm, stern, respectable, steady, industrious, hard-earned success, detail oriented, bursts of rage, suspicious, resentful, poor, defeat, melancholic.",
    url:"https://app.notion.com/p/1f516dcf71648171808ae96e9fbc3f7e"},
  5:{name:"Five",planet:"Mercury",element:"Air",
    numerology:"Within numerology, five carries harmony, justice, protection, and love. In the Yantra system of Hindu numerology, five marks growth.",
    divination:"Restlessness, impatience, clever, takes risks, speculator, adventurer, resourceful, quick-tempered, conceited, sarcastic, self-indulgent, excesses.",
    url:"https://app.notion.com/p/1f516dcf7164818b9471ec43adf7b7aa"},
  6:{name:"Six",planet:"Venus",element:"Earth",
    numerology:"Within numerology, six carries marriage, the union of male and female, and the balance of opposites. In the Yantra system of Hindu numerology, six marks budding.",
    divination:"Harmony, domesticity, peaceful, happiness, kindly, reliable, friendly, loyal, conscientious, idealistic, affectionate, wholesome, conventional, eventual success, artistic, teacher, thorough, fussy, smug, gossipy, conceited, obstinate.",
    url:"https://app.notion.com/p/1f516dcf716481ea9197c791ab17d29a"},
  7:{name:"Seven",planet:"Neptune",element:"Water",
    numerology:"Within numerology, seven carries spirituality, the occult, and intelligence. In the Yantra system of Hindu numerology, seven marks blossoming.",
    divination:"Reclusive, mystic, scholarly, philosopher, occultist, meditative, aloof, penetrative, imaginative, fey, strange.",
    url:"https://app.notion.com/p/1f516dcf716481f8b98fe83e4210948c"},
  8:{name:"Eight",planet:"Saturn",element:"Earth",
    numerology:"Within numerology, eight carries eternity and infinity, along with justice. In the Yantra system of Hindu numerology, eight marks fruit.",
    divination:"Power, money, worldly involvement, practical, tough, cautious, tenacious, materialist, hard worker, curbed eccentricity, rebellious.",
    url:"https://app.notion.com/p/1f516dcf716481378efed8f0c0a2a516"},
  9:{name:"Nine",planet:"Mars",element:"Fire",
    numerology:"Within numerology, nine carries the limited and the limitless, experience and virtue, and completion. In the Yantra system of Hindu numerology, nine marks the harvest.",
    divination:"Mental/spiritual achievement, impulsive, sympathetic, visionary, humanitarian, determined, science, teaching, artistic, unorthodox, intolerant of opposition, self-centered.",
    url:"https://app.notion.com/p/1f516dcf71648144bd0ac25ca1d240e6"}
};

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function reduceDigits(n) {
  const steps = [];
  while (n >= 10) {
    const digits = String(n).split('');
    const next = digits.reduce((a,d) => a + parseInt(d), 0);
    steps.push(digits.join(' + ') + ' <span class="eq">= ' + next + '</span>');
    n = next;
  }
  return {result: n, steps};
}

function run() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const year = now.getFullYear();

  document.getElementById('dateSub').textContent = MONTHS[month-1] + ' ' + day + ', ' + year;

  const allDigits = (String(month) + String(day) + String(year)).split('').map(Number);
  const firstSum = allDigits.reduce((a,b) => a+b, 0);
  const {result, steps} = reduceDigits(firstSum);

  const lines = [allDigits.join(' + ') + ' <span class="eq">= ' + firstSum + '</span>'];
  lines.push(...steps);

  document.getElementById('calcBox').innerHTML = lines.join('<br>');

  const d = NUMBERS[result];
  document.getElementById('numberBig').textContent = result;
  document.getElementById('numberLabel').textContent = "Today's Number";
  document.getElementById('numberName').textContent = d.name;
  document.getElementById('numberMeta').textContent = d.planet + '  ·  ' + d.element;
  document.getElementById('numberDesc').textContent = d.numerology;
  document.getElementById('divinationText').textContent = d.divination;
  document.getElementById('grimoireBtn').href = d.url;
}

run();
</script>
</body>
</html>
