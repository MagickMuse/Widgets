<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagickMuse Widgets</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--cream:#fff1d4;--maroon:#a62524;--dark:#2a1f1f;--darker:#3d2b2b;--muted:#c9a98f;--notion:#E03E3E;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--dark);font-family:'EB Garamond',serif;color:var(--cream);padding:40px 20px;min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-family:'Cinzel Decorative',serif;font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;color:var(--cream);}
  .sub{color:var(--muted);font-size:.85rem;font-style:italic;margin-bottom:36px;}
  .widget-list{display:flex;flex-direction:column;gap:14px;}
  .widget{background:linear-gradient(160deg,var(--darker),var(--dark));border:1px solid var(--maroon);border-radius:10px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .widget-info h2{font-family:'Cinzel Decorative',serif;font-size:.95rem;letter-spacing:.04em;margin:0 0 4px;}
  .widget-info p{color:var(--muted);font-size:.8rem;font-style:italic;margin:0;}
  .widget-links{display:flex;gap:8px;flex-shrink:0;}
  .btn{font-family:'EB Garamond',serif;font-size:.8rem;padding:6px 14px;border-radius:6px;text-decoration:none;letter-spacing:.04em;transition:background .15s;}
  .btn-primary{background:var(--notion);color:#fff;border:1px solid var(--notion);}
  .btn-primary:hover{background:#c93535;}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--maroon);}
  .btn-secondary:hover{color:var(--cream);border-color:var(--notion);}
</style>
</head>
<body>
<div class="wrap">
  <h1>MagickMuse Widgets</h1>
  <p class="sub">Grimoire widgets for embedding in Notion</p>
  <div class="widget-list">
    <div class="widget">
      <div class="widget-info">
        <h2>Rune Pull</h2>
        <p>Elder Futhark &middot; single rune draw</p>
      </div>
      <div class="widget-links">
        <a class="btn btn-primary" href="widgets/runes.html" target="_blank">Open</a>
      </div>
    </div>
    <div class="widget">
      <div class="widget-info">
        <h2>Tarot Pull</h2>
        <p>Rider-Waite &middot; upright &amp; reversed</p>
      </div>
      <div class="widget-links">
        <a class="btn btn-primary" href="widgets/tarot.html" target="_blank">Open</a>
      </div>
    </div>
    <div class="widget">
      <div class="widget-info">
        <h2>Planetary Hours</h2>
        <p>Chaldean order &middot; true local sunrise &amp; sunset</p>
      </div>
      <div class="widget-links">
        <a class="btn btn-primary" href="widgets/planetary-hours.html" target="_blank">Open</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
